<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 400" height="400" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><title>S1 fig2: a model is code plus weights, like a router is forwarding logic plus a FIB</title><desc>Two columns. Router: forwarding logic, the FIB table, and BGP/OSPF which writes the table. LLM: inference code, the weights, and training which writes the weights. A bar shows that on disk Llama 3 8B is almost entirely weights, 16 GB, against a few MB of code.</desc>
<defs><marker id="arrow-5F5E5A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect width="680" height="400" fill="#ffffff" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker></defs>
<text x="160" y="44" text-anchor="middle" font-size="14" fill="#2C2C2A" font-weight="bold">Router</text>
<text x="520" y="44" text-anchor="middle" font-size="14" fill="#2C2C2A" font-weight="bold">LLM</text>
<g><rect x="40" y="60" width="240" height="56" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A" /><text x="160" y="79" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="bold">Forwarding logic</text><text x="160" y="97" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">fixed lookup code, small</text></g>
<g><rect x="400" y="60" width="240" height="56" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A" /><text x="520" y="79" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="bold">Inference code</text><text x="520" y="97" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">fixed matmul sequence, small</text></g>
<g><rect x="40" y="140" width="240" height="56" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56" /><text x="160" y="159" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#085041" font-weight="bold">FIB</text><text x="160" y="177" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">the installed table</text></g>
<g><rect x="400" y="140" width="240" height="56" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56" /><text x="520" y="159" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#085041" font-weight="bold">Weights</text><text x="520" y="177" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">8.03 billion learned numbers</text></g>
<g><rect x="40" y="230" width="240" height="56" rx="8" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D" /><text x="160" y="249" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#712B13" font-weight="bold">BGP / OSPF</text><text x="160" y="267" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">slow; writes the table</text></g>
<g><rect x="400" y="230" width="240" height="56" rx="8" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D" /><text x="520" y="249" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#712B13" font-weight="bold">Training</text><text x="520" y="267" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">slow; writes the weights</text></g>
<line x1="160" y1="230" x2="160" y2="198" marker-end="url(#arrow-5F5E5A)" stroke="#5F5E5A" stroke-width="1.5" fill="none" />
<line x1="520" y1="230" x2="520" y2="198" marker-end="url(#arrow-5F5E5A)" stroke="#5F5E5A" stroke-width="1.5" fill="none" />
<line x1="284" y1="88" x2="396" y2="88" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3" />
<line x1="284" y1="168" x2="396" y2="168" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3" />
<line x1="284" y1="258" x2="396" y2="258" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3" />
<text x="40" y="322" font-size="12" fill="#5F5E5A">Bytes on disk, Llama 3 8B</text>
<rect x="40" y="332" width="600" height="30" rx="4" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56" />
<rect x="40" y="332" width="3" height="30" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A" />
<text x="340" y="347" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A" font-weight="bold">weights: 16 GB</text>
<text x="40" y="382" font-size="12" fill="#5F5E5A">code: a few MB, the sliver at the left edge; same engine + different weights = a different model</text>
