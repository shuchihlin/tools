<line x1="340" y1="250" x2="340" y2="288" marker-end="url(#arrow-5F5E5A)" stroke="#5F5E5A" stroke-width="1.5" fill="none" />
<g><rect x="190" y="290" width="300" height="56" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A" /><text x="340" y="309" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="bold">Output head</text><text x="340" y="327" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">once: vector → a score per vocab word</text></g>
