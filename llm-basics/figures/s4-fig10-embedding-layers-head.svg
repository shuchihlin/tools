<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 470" height="470" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><title>S4 fig10: embedding lookup, layers with attention heads, output head</title><desc>Embedding lookup happens once, turning token IDs into vectors. Each of 32 layers contains attention with 32 heads that gather context, followed by an MLP where each word thinks alone. After the last layer the output head runs once, turning the last position's vector into one score per vocabulary word, and one token is picked.</desc>
<defs><marker id="arrow-5F5E5A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect width="680" height="470" fill="#ffffff" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker></defs>
<g><rect x="190" y="40" width="300" height="56" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A" /><text x="340" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="bold">Embedding lookup</text><text x="340" y="77" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">once: token ID → vector</text></g>
<line x1="340" y1="96" x2="340" y2="126" marker-end="url(#arrow-5F5E5A)" stroke="#5F5E5A" stroke-width="1.5" fill="none" />
<rect x="110" y="128" width="460" height="122" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4" />
<text x="130" y="150" font-size="14" fill="#2C2C2A" font-weight="bold">Layer: repeated 32 times</text>
<g><rect x="130" y="170" width="200" height="56" rx="8" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7" /><text x="230" y="189" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#3C3489" font-weight="bold">Attention</text><text x="230" y="207" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">32 heads gather context</text></g>
<g><rect x="350" y="170" width="200" height="56" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56" /><text x="450" y="189" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#085041" font-weight="bold">MLP</text><text x="450" y="207" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">each word thinks alone</text></g>
