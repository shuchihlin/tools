<svg xmlns="http://www.w3.org/2000/svg" width="740" height="900" viewBox="0 0 740 900" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .title { font-size: 17px; font-weight: 600; fill: #1a1a2e; }
    .sub   { font-size: 12px; fill: #555; }
    .lbl   { font-size: 12px; fill: #1a1a2e; }
    .small { font-size: 11px; fill: #444; }
    .mono  { font-family: Consolas, monospace; font-size: 12.5px; fill: #1a1a2e; }
    .monosm{ font-family: Consolas, monospace; font-size: 11px; fill: #444; }
    .hdr   { font-size: 12px; font-weight: 600; fill: #1a1a2e; }
  </style>
  <rect width="740" height="900" fill="#ffffff"/>

  <text x="20" y="30" class="title">How the head turns h into a next-token choice — toy scale</text>
  <text x="20" y="50" class="sub">Toy: d_model = 4, vocab = 5.  Real: d_model = 4096, vocab = 128256 — same arithmetic, just longer rows and more of them.</text>

  <!-- Step 1: h -->
  <text x="20" y="90" class="hdr">Step 1 — the input: h, the last slot's layer-32 output</text>
  <rect x="40" y="105" width="240" height="30" rx="4" fill="#0b6e99" opacity="0.12" stroke="#0b6e99"/>
  <text x="52" y="125" class="mono">h = [ 2,  -1,   0,   1 ]</text>
  <text x="300" y="125" class="small">(one vector, fixed size, regardless of how long the context was)</text>

  <!-- Step 2: dot each row -->
  <text x="20" y="170" class="hdr">Step 2 — one dot product per vocab row of W_head  (score = correlation of h with that row)</text>

  <g>
    <rect x="40" y="185" width="660" height="26" fill="#eef3f7" stroke="#c9d4dd"/>
    <text x="52" y="203" class="mono">"packet"   [ 1, -1,  1,  1]·h = 2·1 + (-1)(-1) + 0·1 + 1·1 = 2+1+0+1 =  4.0</text>

    <rect x="40" y="215" width="660" height="26" fill="#f7fafc" stroke="#c9d4dd"/>
    <text x="52" y="233" class="mono">"frame"    [ 1,  0,  2,  0]·h = 2·1 + 0 + 0 + 0            =  2.0</text>

    <rect x="40" y="245" width="660" height="26" fill="#eef3f7" stroke="#c9d4dd"/>
    <text x="52" y="263" class="mono">"datagram" [ 0, -1,  0,  0]·h = 0 + 1 + 0 + 0              =  1.0</text>

    <rect x="40" y="275" width="660" height="26" fill="#f7fafc" stroke="#c9d4dd"/>
    <text x="52" y="293" class="mono">"the"      [ 0,  0,  1,  0]·h = 0 + 0 + 0 + 0              =  0.0</text>

    <rect x="40" y="305" width="660" height="26" fill="#eef3f7" stroke="#c9d4dd"/>
    <text x="52" y="323" class="mono">"cat"      [ 0,  1,  0,  0]·h = 0 - 1 + 0 + 0              = -1.0</text>
  </g>
  <text x="40" y="352" class="small">Real scale: each score = 4096 MACs (multiply–accumulates); 128256 scores = 525M MACs = 1.05 GFLOPs per generated token.</text>
  <text x="40" y="368" class="small">These raw scores are called LOGITS — unbounded, can be negative, don't sum to anything.</text>

  <!-- Step 3: softmax -->
  <text x="20" y="405" class="hdr">Step 3 — softmax: exponentiate, then normalize to sum to 1</text>
  <text x="40" y="425" class="mono">P(v) = e^(s_v) / Σ e^(s)</text>

  <g>
    <text x="60"  y="455" class="hdr">token</text>
    <text x="180" y="455" class="hdr">s</text>
    <text x="260" y="455" class="hdr">e^s</text>
    <text x="380" y="455" class="hdr">P = e^s / 66.1</text>
    <line x1="40" y1="462" x2="520" y2="462" stroke="#c9d4dd"/>

    <text x="60" y="482" class="mono">packet</text>   <text x="170" y="482" class="mono"> 4.0</text> <text x="250" y="482" class="mono">54.60</text> <text x="390" y="482" class="mono">0.826</text>
    <text x="60" y="504" class="mono">frame</text>    <text x="170" y="504" class="mono"> 2.0</text> <text x="250" y="504" class="mono"> 7.39</text> <text x="390" y="504" class="mono">0.112</text>
    <text x="60" y="526" class="mono">datagram</text> <text x="170" y="526" class="mono"> 1.0</text> <text x="250" y="526" class="mono"> 2.72</text> <text x="390" y="526" class="mono">0.041</text>
    <text x="60" y="548" class="mono">the</text>      <text x="170" y="548" class="mono"> 0.0</text> <text x="250" y="548" class="mono"> 1.00</text> <text x="390" y="548" class="mono">0.015</text>
    <text x="60" y="570" class="mono">cat</text>      <text x="170" y="570" class="mono">-1.0</text> <text x="250" y="570" class="mono"> 0.37</text> <text x="390" y="570" class="mono">0.006</text>
    <line x1="40" y1="580" x2="520" y2="580" stroke="#c9d4dd"/>
    <text x="250" y="600" class="mono">66.08</text>   <text x="390" y="600" class="mono">1.000</text>
    <text x="250" y="616" class="small">(sum)</text>
  </g>

  <!-- bars -->
  <g>
    <rect x="540" y="470" width="132" height="15" fill="#0b6e99"/>          <text x="540" y="466" class="small">packet .826</text>
    <rect x="540" y="496" width="18"  height="15" fill="#0b6e99" opacity="0.75"/><text x="564" y="508" class="small">frame .112</text>
    <rect x="540" y="522" width="7"   height="15" fill="#0b6e99" opacity="0.6"/> <text x="553" y="534" class="small">datagram .041</text>
    <rect x="540" y="548" width="3"   height="15" fill="#0b6e99" opacity="0.5"/> <text x="549" y="560" class="small">the .015</text>
    <rect x="540" y="574" width="1.5" height="15" fill="#0b6e99" opacity="0.4"/> <text x="547" y="586" class="small">cat .006</text>
  </g>

  <!-- Step 4: pick -->
  <text x="20" y="655" class="hdr">Step 4 — pick ONE token from the distribution</text>
  <rect x="40" y="670" width="320" height="90" rx="6" fill="#f4f7fa" stroke="#c9d4dd"/>
  <text x="56" y="692" class="lbl" font-weight="600">Greedy (argmax)</text>
  <text x="56" y="712" class="small">take the max score → "packet", every time.</text>
  <text x="56" y="728" class="small">Deterministic. No sort needed — one max-scan.</text>
  <text x="56" y="744" class="small">(Softmax not even required: argmax of s = argmax of P.)</text>

  <rect x="380" y="670" width="330" height="90" rx="6" fill="#fdf3e7" stroke="#d9b98a"/>
  <text x="396" y="692" class="lbl" font-weight="600">Sampling (what chat products do)</text>
  <text x="396" y="712" class="small">draw randomly, weighted by P: "packet" 82.6% of runs,</text>
  <text x="396" y="728" class="small">"frame" 11.2%, … The ONLY place randomness enters —</text>
  <text x="396" y="744" class="small">why the same prompt gives different answers.</text>

  <!-- temperature -->
  <rect x="40" y="780" width="670" height="100" rx="6" fill="#f4f7fa" stroke="#c9d4dd"/>
  <text x="56" y="803" class="lbl" font-weight="600">Temperature T — a knob applied before softmax:  P(v) ∝ e^(s_v / T)</text>
  <text x="56" y="826" class="mono">T = 1 :  [.826  .112  .041  .015  .006]   (as above)</text>
  <text x="56" y="846" class="mono">T = 2 :  [.553  .203  .123  .075  .045]   (flatter → more adventurous)</text>
  <text x="56" y="866" class="mono">T → 0 :  [1.00  0     0     0     0  ]   (collapses to greedy)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
