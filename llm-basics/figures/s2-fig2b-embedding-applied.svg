<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="920" height="640" fill="#fcfcfb"/>

  <defs>
    <marker id="ae" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#898781"/>
    </marker>
    <marker id="ae2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1baf7a"/>
    </marker>
  </defs>

  <text x="32" y="40" font-size="18" font-weight="600" fill="#0b0b0b">The embedding matrix: what it is, how a token &#8220;goes through&#8221; it</text>
  <text x="32" y="62" font-size="13" fill="#52514e">It is applied by LOOKUP: the token ID is a row number; that row is copied. No arithmetic at all.</text>

  <!-- input words and IDs -->
  <g font-size="13" fill="#0b0b0b">
    <text x="40" y="147">&#8220;&#9251;drops&#8221;</text>
    <text x="40" y="229">&#8220;&#9251;the&#8221;</text>
    <text x="40" y="309">&#8220;&#9251;packet&#8221;</text>
  </g>
  <g font-size="12" fill="#52514e" font-family="ui-monospace, monospace">
    <text x="108" y="147">ID 21701</text>
    <text x="108" y="229">ID 279</text>
    <text x="108" y="309">ID 10361</text>
  </g>

  <!-- arrows ID -> matrix row (note crossing: sentence order != row order) -->
  <g stroke="#898781" stroke-width="1.5" fill="none" marker-end="url(#ae)">
    <line x1="180" y1="143" x2="326" y2="303"/>
    <line x1="180" y1="225" x2="326" y2="143"/>
    <line x1="180" y1="305" x2="326" y2="225"/>
  </g>

  <!-- embedding matrix -->
  <text x="430" y="94" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" font-family="ui-monospace, monospace">embedding matrix [128256 &#215; 4096]</text>
  <rect x="330" y="102" width="200" height="258" fill="#9ec5f4" rx="4"/>
  <g>
    <rect x="330" y="136" width="200" height="15" fill="#eb6834"/>
    <text x="430" y="148" font-size="10.5" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, monospace">row 279</text>
    <rect x="330" y="218" width="200" height="15" fill="#eb6834"/>
    <text x="430" y="230" font-size="10.5" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, monospace">row 10361</text>
    <rect x="330" y="296" width="200" height="15" fill="#eb6834"/>
    <text x="430" y="308" font-size="10.5" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, monospace">row 21701</text>
  </g>
  <text x="430" y="380" font-size="11.5" fill="#898781" text-anchor="middle">128,256 rows: one per vocab entry, sorted by ID</text>

  <!-- arrows row -> position vectors (crossing again) -->
  <g stroke="#898781" stroke-width="1.5" fill="none" marker-end="url(#ae)">
    <line x1="530" y1="143" x2="596" y2="225"/>
    <line x1="530" y1="303" x2="596" y2="140"/>
    <line x1="530" y1="225" x2="596" y2="305"/>
  </g>

  <!-- position vectors -->
  <g fill="#2a78d6">
    <rect x="600" y="130" width="190" height="20" rx="3"/>
    <rect x="600" y="215" width="190" height="20" rx="3"/>
    <rect x="600" y="295" width="190" height="20" rx="3"/>
  </g>
  <g font-size="11.5" fill="#52514e">
    <text x="600" y="166">pos 0 &#8220;&#9251;drops&#8221; = copy of row 21701</text>
    <text x="600" y="251">pos 1 &#8220;&#9251;the&#8221; = copy of row 279</text>
    <text x="600" y="331">pos 2 &#8220;&#9251;packet&#8221; = copy of row 10361</text>
  </g>
  <text x="695" y="380" font-size="12" fill="#0b0b0b" text-anchor="middle" font-family="ui-monospace, monospace">X [3 &#215; 4096] &#8594; layer 1</text>

  <text x="165" y="380" font-size="11.5" fill="#898781" text-anchor="middle">arrows cross: position &#8800; row number</text>

  <!-- leader from matrix to its sliver in the budget bar -->
  <path d="M 330,355 C 160,400 70,420 46,448" stroke="#1baf7a" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ae2)"/>

  <!-- Panel B: the fig-2 bar, labeled -->
  <text x="32" y="432" font-size="14" font-weight="600" fill="#0b0b0b">Where it sits in the 8.03&#8202;B (figure 2, revisited)</text>
  <rect x="32"  y="450" width="55" height="46" fill="#1baf7a" rx="3"/>
  <rect x="89"  y="450" width="740" height="46" fill="#2a78d6" rx="3"/>
  <rect x="831" y="450" width="57" height="46" fill="#1baf7a" rx="3"/>
  <text x="460" y="470" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">32 layers &#215; 218.1&#8202;M = 6.98&#8202;B</text>
  <text x="460" y="488" font-size="11.5" fill="#ffffff" text-anchor="middle">each layer: attention 41.9&#8202;M + MLP 176.2&#8202;M &#8212; both multiplied for every token</text>

  <line x1="60" y1="496" x2="60" y2="510" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="32" y="526" font-size="12" fill="#52514e">&#8593; this block IS the embedding matrix drawn above &#8212; 525&#8202;M, 6.5%, applied by lookup</text>
  <line x1="860" y1="496" x2="860" y2="540" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="888" y="556" font-size="12" fill="#52514e" text-anchor="end">&#8593; output head [128256&#215;4096] = the other 525&#8202;M &#8212; fully multiplied every pass</text>

  <!-- footer reconciliation -->
  <line x1="32" y1="576" x2="888" y2="576" stroke="#e1e0d9" stroke-width="1"/>
  <text x="32" y="602" font-size="13.5" fill="#0b0b0b">8.03&#8202;B total = 525&#8202;M embedding (copied, never multiplied) + 6.98&#8202;B layers + 525&#8202;M head &#8594; <tspan font-weight="600">7.50&#8202;B multiplied per token</tspan></text>
  <text x="32" y="624" font-size="12.5" fill="#52514e">Tokens shown are from &#8220;If the router drops the packet&#8221;; &#9251; marks the leading space, which is part of each token.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
