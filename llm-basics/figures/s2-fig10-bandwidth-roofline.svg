<svg xmlns="http://www.w3.org/2000/svg" width="740" height="1000" viewBox="0 0 740 1000" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .title { font-size: 17px; font-weight: 600; fill: #1a1a2e; }
    .sub   { font-size: 12px; fill: #555; }
    .lbl   { font-size: 12px; fill: #1a1a2e; }
    .small { font-size: 11px; fill: #444; }
    .mono  { font-family: Consolas, monospace; font-size: 12.5px; fill: #1a1a2e; }
    .monosm{ font-family: Consolas, monospace; font-size: 11px; fill: #444; }
    .hdr   { font-size: 13px; font-weight: 600; fill: #1a1a2e; }
  </style>
  <rect width="740" height="1000" fill="#ffffff"/>

  <text x="20" y="30" class="title">Panel A — Decode is a streaming problem: the pipe, not the ALUs, sets tok/s</text>

  <!-- HBM box -->
  <rect x="40" y="60" width="180" height="110" rx="8" fill="#0b6e99" opacity="0.10" stroke="#0b6e99"/>
  <text x="55" y="85" class="lbl" font-weight="600">HBM (on-package)</text>
  <text x="55" y="106" class="mono">weights: 16 GB</text>
  <text x="55" y="124" class="small">(8.03B params × 2 B, BF16)</text>
  <text x="55" y="146" class="small">+ KV cache, activations</text>

  <!-- pipe -->
  <rect x="220" y="95" width="150" height="34" fill="#0b6e99" opacity="0.25"/>
  <polygon points="370,85 400,112 370,139" fill="#0b6e99" opacity="0.35"/>
  <text x="228" y="116" class="mono">3.35 TB/s</text>
  <text x="228" y="150" class="small">the pipe (H100 HBM3)</text>

  <!-- compute box -->
  <rect x="405" y="60" width="300" height="110" rx="8" fill="#fdf3e7" stroke="#d9b98a"/>
  <text x="420" y="85" class="lbl" font-weight="600">Compute (tensor cores)</text>
  <text x="420" y="106" class="mono">989 TFLOP/s  FP16</text>
  <text x="420" y="126" class="small">needs per token: 15.0 GFLOPs</text>
  <text x="420" y="144" class="small">available while streaming: 4,430 GFLOPs</text>
  <text x="420" y="162" class="small" font-weight="600">→ utilization ≈ 0.3%. ALUs idle 99.7%.</text>

  <!-- derivation -->
  <rect x="40" y="190" width="665" height="96" rx="6" fill="#f4f7fa" stroke="#c9d4dd"/>
  <text x="56" y="214" class="mono">every token must stream ALL multiplied weights (15 GB) past the ALUs:</text>
  <text x="56" y="238" class="mono">8B :  15 GB ÷ 3.35 TB/s ≈ 4.5 ms/token  →  ~220 tok/s ceiling (1 GPU, batch 1)</text>
  <text x="56" y="260" class="mono">70B: 140 GB ÷ 3.35 TB/s ≈  42 ms/token  →   ~24 tok/s ceiling</text>
  <text x="56" y="278" class="small">Bytes ledger sets the clock; FLOPs ledger doesn't even show up. Line-rate is the pipe's, not the forwarding engine's.</text>

  <!-- ===== Panel B ===== -->
  <text x="20" y="330" class="title">Panel B — Roofline: which ledger binds = workload ratio vs machine ratio</text>
  <text x="20" y="350" class="sub">Machine balance: 989 TFLOP/s ÷ 3.35 TB/s ≈ 295 FLOPs must arrive per byte fetched, or the ALUs starve.</text>

  <!-- axes -->
  <line x1="80" y1="700" x2="660" y2="700" stroke="#999" stroke-width="1.5"/>
  <line x1="80" y1="700" x2="80" y2="390" stroke="#999" stroke-width="1.5"/>
  <text x="240" y="738" class="small">arithmetic intensity: FLOPs per byte fetched  (log scale)</text>
  <text x="26" y="380" class="small">attainable</text>
  <text x="26" y="394" class="small">TFLOP/s</text>

  <!-- x ticks -->
  <text x="76" y="716" class="monosm">1</text>
  <text x="166" y="716" class="monosm">4</text>
  <text x="256" y="716" class="monosm">16</text>
  <text x="346" y="716" class="monosm">64</text>
  <text x="436" y="716" class="monosm">256</text>
  <text x="526" y="716" class="monosm">1024</text>
  <text x="616" y="716" class="monosm">4096</text>

  <!-- bandwidth slope: from (80,660) at I=1/3.35TF to ridge (449,475) -->
  <line x1="80" y1="660" x2="449" y2="475" stroke="#0b6e99" stroke-width="2.5"/>
  <text x="150" y="600" class="small" fill="#0b6e99" transform="rotate(-27 150 600)">bandwidth roof: 3.35 TB/s × intensity</text>
  <!-- compute roof -->
  <line x1="449" y1="475" x2="660" y2="475" stroke="#b5651d" stroke-width="2.5"/>
  <text x="475" y="465" class="small" fill="#b5651d">compute roof: 989 TFLOP/s</text>
  <!-- ridge -->
  <line x1="449" y1="475" x2="449" y2="700" stroke="#ccc" stroke-dasharray="4,3"/>
  <text x="420" y="694" class="monosm">≈295</text>

  <!-- points -->
  <circle cx="80" cy="660" r="6" fill="#0b6e99"/>
  <text x="94" y="655" class="small" font-weight="600">decode, batch=1: intensity ≈ 1</text>
  <text x="94" y="670" class="small">(2P FLOPs / 2P bytes) — deep in bandwidth territory</text>

  <circle cx="350" cy="525" r="6" fill="#0b6e99" opacity="0.7"/>
  <text x="330" y="512" class="small">decode, batch=64: intensity ≈ 64</text>

  <circle cx="575" cy="475" r="6" fill="#b5651d"/>
  <text x="470" y="440" class="small">prefill, 2048-token prompt: intensity ≈ 2048</text>
  <text x="470" y="455" class="small">→ compute-bound even at batch 1</text>

  <!-- batching arrow -->
  <line x1="110" y1="645" x2="330" y2="535" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3"/>
  <polygon points="330,530 340,530 333,542" fill="#555"/>
  <text x="150" y="660" class="small">batching: B requests share one weight stream → intensity ≈ B</text>

  <!-- ===== Panel C ===== -->
  <text x="20" y="790" class="title">Panel C — The two phases of one request hit different roofs</text>
  <rect x="40" y="810" width="320" height="130" rx="6" fill="#f4f7fa" stroke="#c9d4dd"/>
  <text x="56" y="834" class="lbl" font-weight="600">PREFILL (read the prompt)</text>
  <text x="56" y="856" class="small">n positions per weight fetch → intensity ≈ n</text>
  <text x="56" y="874" class="mono">2048 tok: 31 TFLOPs ÷ 989 TFLOP/s</text>
  <text x="56" y="892" class="mono">≈ 31 ms total</text>
  <text x="56" y="912" class="small">compute-bound; sets time-to-first-token</text>

  <rect x="380" y="810" width="330" height="130" rx="6" fill="#fdf3e7" stroke="#d9b98a"/>
  <text x="396" y="834" class="lbl" font-weight="600">DECODE (generate the answer)</text>
  <text x="396" y="856" class="small">1 position per weight fetch → intensity ≈ 1×batch</text>
  <text x="396" y="874" class="mono">2048 tok: 2048 × 4.5 ms</text>
  <text x="396" y="892" class="mono">≈ 9.2 s total</text>
  <text x="396" y="912" class="small">bandwidth-bound; sets tok/s you watch</text>

  <text x="40" y="970" class="small">Same model, same GPU, ~300× difference per token — why the answer streams out slowly after appearing to start instantly.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
