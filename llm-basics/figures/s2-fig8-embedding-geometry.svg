<svg xmlns="http://www.w3.org/2000/svg" width="740" height="960" viewBox="0 0 740 960" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .title { font-size: 17px; font-weight: 600; fill: #1a1a2e; }
    .sub   { font-size: 12px; fill: #555; }
    .lbl   { font-size: 12px; fill: #1a1a2e; }
    .small { font-size: 11px; fill: #444; }
    .mono  { font-family: Consolas, monospace; font-size: 12px; fill: #1a1a2e; }
    .monosm{ font-family: Consolas, monospace; font-size: 11px; fill: #444; }
    .accent{ fill: #0b6e99; }
  </style>
  <rect width="740" height="960" fill="#ffffff"/>

  <!-- ============ PANEL A ============ -->
  <text x="20" y="30" class="title">Panel A — Meaning is geometry (4096-dim space, drawn in 2-D)</text>
  <text x="20" y="50" class="sub">Each vocab entry's embedding row E[id] is a point/arrow. Training pushes interchangeable tokens together.</text>

  <!-- axes -->
  <line x1="90" y1="380" x2="90" y2="80"  stroke="#999" stroke-width="1.5"/>
  <line x1="90" y1="380" x2="480" y2="380" stroke="#999" stroke-width="1.5"/>
  <text x="475" y="398" class="small">dim i (one of 4096)</text>
  <text x="30" y="85" class="small">dim j</text>

  <!-- networking cluster -->
  <g>
    <ellipse cx="360" cy="150" rx="95" ry="55" fill="#0b6e99" opacity="0.08"/>
    <circle cx="330" cy="130" r="4" fill="#0b6e99"/><text x="340" y="127" class="lbl">router</text>
    <circle cx="390" cy="145" r="4" fill="#0b6e99"/><text x="400" y="142" class="lbl">switch</text>
    <circle cx="320" cy="170" r="4" fill="#0b6e99"/><text x="330" y="185" class="lbl">gateway</text>
    <circle cx="395" cy="180" r="4" fill="#0b6e99"/><text x="405" y="184" class="lbl">packet</text>
  </g>

  <!-- animal cluster -->
  <g>
    <ellipse cx="180" cy="300" rx="65" ry="40" fill="#b5651d" opacity="0.10"/>
    <circle cx="160" cy="290" r="4" fill="#b5651d"/><text x="118" y="287" class="lbl">cat</text>
    <circle cx="205" cy="310" r="4" fill="#b5651d"/><text x="215" y="314" class="lbl">dog</text>
  </g>

  <!-- vectors from origin -->
  <line x1="90" y1="380" x2="330" y2="130" stroke="#0b6e99" stroke-width="2"/>
  <line x1="90" y1="380" x2="390" y2="145" stroke="#0b6e99" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="90" y1="380" x2="160" y2="290" stroke="#b5651d" stroke-width="2"/>

  <!-- angle arcs -->
  <path d="M 138 330 A 68 68 0 0 1 152 315" fill="none" stroke="#0b6e99" stroke-width="1.5"/>
  <text x="158" y="330" class="small" fill="#0b6e99">small θ → cos θ ≈ 1 (similar)</text>
  <path d="M 118 344 A 46 46 0 0 1 124 337" fill="none" stroke="#b5651d" stroke-width="1.5"/>
  <text x="60" y="255" class="small" fill="#b5651d">large θ → cos θ ≈ 0</text>
  <text x="60" y="270" class="small" fill="#b5651d">(unrelated)</text>

  <!-- formula box -->
  <rect x="500" y="90" width="220" height="120" rx="6" fill="#f4f7fa" stroke="#c9d4dd"/>
  <text x="512" y="115" class="mono">a · b = Σ aᵢ·bᵢ</text>
  <text x="512" y="140" class="mono">cos θ = a·b / (|a|·|b|)</text>
  <text x="512" y="168" class="monosm">dot product = correlation:</text>
  <text x="512" y="184" class="monosm">aligned → large, +</text>
  <text x="512" y="200" class="monosm">orthogonal → 0</text>

  <!-- random-vector fact -->
  <rect x="500" y="230" width="220" height="105" rx="6" fill="#f4f7fa" stroke="#c9d4dd"/>
  <text x="512" y="253" class="small" font-weight="600">High-dimensional room:</text>
  <text x="512" y="272" class="small">two RANDOM 4096-dim vectors:</text>
  <text x="512" y="292" class="mono">|cos θ| ≈ 1/√4096 = 1/64</text>
  <text x="512" y="312" class="small">≈ 0.016 — nearly orthogonal.</text>
  <text x="512" y="328" class="small">Room for many distinct directions.</text>

  <!-- ============ PANEL B ============ -->
  <line x1="20" y1="430" x2="720" y2="430" stroke="#ddd"/>
  <text x="20" y="465" class="title">Panel B — The head is a correlator bank (last loop stage, one token out)</text>
  <text x="20" y="485" class="sub">Score for every vocab entry v = correlation of the stream's final state h with v's direction row.</text>

  <!-- h vector -->
  <rect x="40" y="530" width="46" height="180" rx="4" fill="#0b6e99" opacity="0.15" stroke="#0b6e99"/>
  <text x="47" y="620" class="mono">h</text>
  <text x="20" y="730" class="small">[4096]</text>
  <text x="20" y="746" class="small">layer-32 output,</text>
  <text x="20" y="762" class="small">LAST position only</text>

  <!-- arrow -->
  <line x1="95" y1="620" x2="145" y2="620" stroke="#555" stroke-width="1.5"/>
  <polygon points="145,615 155,620 145,625" fill="#555"/>

  <!-- head matrix rows -->
  <text x="170" y="515" class="lbl" font-weight="600">W_head  [128256 × 4096]</text>
  <g>
    <rect x="170" y="530" width="230" height="22" fill="#eef3f7" stroke="#c9d4dd"/>
    <text x="178" y="546" class="monosm">row "packet"   · h = 12.1</text>
    <rect x="170" y="556" width="230" height="22" fill="#eef3f7" stroke="#c9d4dd"/>
    <text x="178" y="572" class="monosm">row "frame"    · h =  9.8</text>
    <rect x="170" y="582" width="230" height="22" fill="#eef3f7" stroke="#c9d4dd"/>
    <text x="178" y="598" class="monosm">row "datagram" · h =  8.3</text>
    <rect x="170" y="608" width="230" height="22" fill="#eef3f7" stroke="#c9d4dd"/>
    <text x="178" y="624" class="monosm">row "cat"      · h = -3.0</text>
    <text x="270" y="648" class="mono">⋮</text>
    <rect x="170" y="660" width="230" height="22" fill="#eef3f7" stroke="#c9d4dd"/>
    <text x="178" y="676" class="monosm">row 128,255    · h = -7.4</text>
  </g>
  <text x="170" y="706" class="small">128,256 correlators × 4096 MACs each</text>
  <text x="170" y="722" class="small">= 525M MACs = 1.05 GFLOPs / token</text>
  <text x="170" y="738" class="small">(matches the head's 525M params —</text>
  <text x="170" y="754" class="small">each weight touched once, FLOP ladder)</text>

  <!-- arrow to softmax -->
  <line x1="410" y1="620" x2="455" y2="620" stroke="#555" stroke-width="1.5"/>
  <polygon points="455,615 465,620 455,625" fill="#555"/>
  <rect x="468" y="595" width="80" height="50" rx="6" fill="#fdf3e7" stroke="#d9b98a"/>
  <text x="481" y="625" class="mono">softmax</text>

  <!-- arrow to bars -->
  <line x1="550" y1="620" x2="585" y2="620" stroke="#555" stroke-width="1.5"/>
  <polygon points="585,615 595,620 585,625" fill="#555"/>

  <!-- probability bars -->
  <g>
    <text x="600" y="545" class="lbl" font-weight="600">P(next token)</text>
    <rect x="600" y="556" width="108" height="14" fill="#0b6e99"/><text x="712" y="568" class="small">packet .74</text>
    <rect x="600" y="576" width="32" height="14" fill="#0b6e99" opacity="0.7"/><text x="638" y="588" class="small">frame .17</text>
    <rect x="600" y="596" width="14" height="14" fill="#0b6e99" opacity="0.5"/><text x="620" y="608" class="small">datagram .05</text>
    <rect x="600" y="616" width="3" height="14" fill="#0b6e99" opacity="0.4"/><text x="609" y="628" class="small">cat .0000…</text>
  </g>

  <!-- E vs head contrast box -->
  <rect x="40" y="790" width="680" height="150" rx="6" fill="#f4f7fa" stroke="#c9d4dd"/>
  <text x="56" y="815" class="lbl" font-weight="600">Same shape, opposite access pattern:</text>
  <text x="56" y="840" class="mono">E      [128256×4096] read by INDEX:   X[i] = E[id]  — 1 row fetched, 0 FLOPs</text>
  <text x="56" y="864" class="mono">W_head [128256×4096] read by MATMUL:  s = W_head·h  — ALL rows streamed, 525M MACs</text>
  <text x="56" y="892" class="small">Entry: random-access lookup (one row per input token). Exit: full scan — every vocab direction</text>
  <text x="56" y="908" class="small">correlated against the stream state, once per generated token. (Some models tie E = W_head;</text>
  <text x="56" y="924" class="small">Llama 3 8B keeps them separate: 525M + 525M in the 8.03B ledger.)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
