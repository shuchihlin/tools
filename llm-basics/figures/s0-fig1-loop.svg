<svg xmlns="http://www.w3.org/2000/svg" width="920" height="610" viewBox="0 0 920 610" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="920" height="610" fill="#fcfcfb"/>

  <defs>
    <marker id="ar0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#898781"/>
    </marker>
  </defs>

  <text x="32" y="40" font-size="18" font-weight="600" fill="#0b0b0b">The whole machine is one loop</text>
  <text x="32" y="62" font-size="13" fill="#52514e">Predict the next token; append it; run again. Every LLM behavior is this loop spinning.</text>

  <!-- context box -->
  <rect x="32" y="130" width="150" height="104" fill="#f0efec" rx="6"/>
  <text x="107" y="155" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">context so far</text>
  <g font-size="11" fill="#52514e" text-anchor="middle" font-family="ui-monospace, monospace">
    <text x="107" y="178">Explain BGP</text>
    <text x="107" y="194">in one</text>
    <text x="107" y="210">sentence:</text>
  </g>

  <line x1="182" y1="182" x2="200" y2="182" stroke="#898781" stroke-width="1.5" marker-end="url(#ar0)"/>

  <!-- tokenizer -->
  <rect x="204" y="152" width="100" height="60" fill="#f0efec" rx="6"/>
  <text x="254" y="178" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">tokenizer</text>
  <text x="254" y="196" font-size="11" fill="#52514e" text-anchor="middle">text &#8594; IDs</text>

  <line x1="304" y1="182" x2="322" y2="182" stroke="#898781" stroke-width="1.5" marker-end="url(#ar0)"/>

  <!-- token ids -->
  <g font-size="11" fill="#52514e" font-family="ui-monospace, monospace">
    <text x="328" y="175">[849, 21435,</text>
    <text x="328" y="191">426, 25434, &#8230;]</text>
  </g>

  <line x1="418" y1="182" x2="436" y2="182" stroke="#898781" stroke-width="1.5" marker-end="url(#ar0)"/>

  <!-- transformer -->
  <rect x="440" y="110" width="150" height="144" fill="#2a78d6" rx="6"/>
  <g fill="#ffffff" text-anchor="middle">
    <text x="515" y="148" font-size="13.5" font-weight="600">transformer</text>
    <text x="515" y="176" font-size="11.5">embedding</text>
    <text x="515" y="194" font-size="11.5">&#8594; 32 layers</text>
    <text x="515" y="212" font-size="11.5">&#8594; output head</text>
    <text x="515" y="238" font-size="10.5">one pass = all of Session 2</text>
  </g>

  <line x1="590" y1="182" x2="608" y2="182" stroke="#898781" stroke-width="1.5" marker-end="url(#ar0)"/>

  <!-- probability distribution -->
  <text x="616" y="122" font-size="11.5" fill="#52514e">P(next token) &#8212; all 128,256 of them</text>
  <g font-size="11" font-family="ui-monospace, monospace">
    <text x="662" y="141" fill="#0b0b0b" text-anchor="end">BGP</text>
    <rect x="668" y="131" width="90" height="13" fill="#2a78d6" rx="2"/>
    <text x="764" y="141" fill="#52514e">.41</text>

    <text x="662" y="163" fill="#0b0b0b" text-anchor="end">Border</text>
    <rect x="668" y="153" width="48" height="13" fill="#2a78d6" rx="2"/>
    <text x="722" y="163" fill="#52514e">.22</text>

    <text x="662" y="185" fill="#0b0b0b" text-anchor="end">It</text>
    <rect x="668" y="175" width="20" height="13" fill="#2a78d6" rx="2"/>
    <text x="694" y="185" fill="#52514e">.09</text>

    <text x="662" y="207" fill="#0b0b0b" text-anchor="end">The</text>
    <rect x="668" y="197" width="15" height="13" fill="#2a78d6" rx="2"/>
    <text x="689" y="207" fill="#52514e">.07</text>

    <text x="616" y="229" fill="#898781">&#8942; 128,252 more, tiny</text>
  </g>

  <line x1="790" y1="182" x2="806" y2="182" stroke="#898781" stroke-width="1.5" marker-end="url(#ar0)"/>

  <!-- sampler -->
  <rect x="810" y="152" width="78" height="60" fill="#f0efec" rx="6"/>
  <text x="849" y="178" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">pick one</text>
  <text x="849" y="196" font-size="11" fill="#52514e" text-anchor="middle">sampling</text>

  <line x1="849" y1="212" x2="849" y2="256" stroke="#898781" stroke-width="1.5" marker-end="url(#ar0)"/>

  <!-- chosen token -->
  <rect x="816" y="260" width="66" height="30" fill="#eb6834" rx="15"/>
  <text x="849" y="280" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">BGP</text>

  <!-- loop back -->
  <polyline points="849,290 849,326 107,326 107,242" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#ar0)"/>
  <rect x="270" y="312" width="420" height="24" fill="#fcfcfb"/>
  <text x="478" y="328" font-size="12" fill="#52514e" text-anchor="middle">append the chosen token to the context &#8212; run everything again. One loop pass per generated token.</text>

  <!-- session map -->
  <line x1="32" y1="366" x2="888" y2="366" stroke="#e1e0d9" stroke-width="1"/>
  <text x="32" y="394" font-size="14" font-weight="600" fill="#0b0b0b">Where the sessions sit on this skeleton</text>

  <g>
    <rect x="32" y="408" width="200" height="112" fill="#f0efec" rx="6"/>
    <text x="48" y="434" font-size="12.5" font-weight="600" fill="#0b0b0b">S1 &#8212; the artifact</text>
    <g font-size="11.5" fill="#52514e">
      <text x="48" y="456">the weights file: 8.03&#8202;B</text>
      <text x="48" y="473">learned floats &#8212; the state</text>
      <text x="48" y="490">this loop runs on</text>
    </g>
  </g>
  <g>
    <rect x="250" y="408" width="200" height="112" fill="#f0efec" rx="6"/>
    <text x="266" y="434" font-size="12.5" font-weight="600" fill="#0b0b0b">S2 &#8212; one pass</text>
    <g font-size="11.5" fill="#52514e">
      <text x="266" y="456">the math inside a single</text>
      <text x="266" y="473">pass: tensors, matmuls,</text>
      <text x="266" y="490">FLOPs, bytes</text>
    </g>
  </g>
  <g>
    <rect x="468" y="408" width="200" height="112" fill="#f0efec" rx="6"/>
    <text x="484" y="434" font-size="12.5" font-weight="600" fill="#0b0b0b">S3 &#8212; the stack</text>
    <g font-size="11.5" fill="#52514e">
      <text x="484" y="456">tokens, attention, context</text>
      <text x="484" y="473">window &#8212; and why the loop</text>
      <text x="484" y="490">doesn&#8217;t redo old work</text>
      <text x="484" y="507">(KV cache)</text>
    </g>
  </g>
  <g>
    <rect x="686" y="408" width="202" height="112" fill="#f0efec" rx="6"/>
    <text x="702" y="434" font-size="12.5" font-weight="600" fill="#0b0b0b">S4 &#8212; the state&#8217;s origin</text>
    <g font-size="11.5" fill="#52514e">
      <text x="702" y="456">training: how prediction</text>
      <text x="702" y="473">errors on internet text</text>
      <text x="702" y="490">became those floats</text>
    </g>
  </g>

  <text x="32" y="556" font-size="12.5" fill="#0b0b0b">Chat is not a separate mode: a transcript is just a document the model keeps completing.</text>
  <text x="32" y="576" font-size="12.5" fill="#52514e">System prompts, tool results, retrieved documents (RAG) &#8212; all just more tokens in the context. The loop never changes.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
