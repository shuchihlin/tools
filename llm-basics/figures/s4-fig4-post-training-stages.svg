<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 330" height="330" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><title>S4 fig4: pretraining, supervised fine-tuning, RLHF</title><desc>Pretraining on trillions of words produces a document continuer. Supervised fine-tuning on example chats produces an assistant. RLHF from people ranking answers produces preferred answers. Example responses to the prompt Explain DNS briefly: the base model continues with more quiz questions, the fine-tuned model answers, and RLHF picks the clearest of several drafts.</desc>
