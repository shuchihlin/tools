<g><rect x="40" y="130" width="180" height="56" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A" /><text x="130" y="149" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="bold">Continues documents</text><text x="130" y="167" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">knows a lot, no role</text></g>
<g><rect x="250" y="130" width="180" height="56" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A" /><text x="340" y="149" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="bold">Plays assistant</text><text x="340" y="167" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">answers the question</text></g>
<g><rect x="460" y="130" width="180" height="56" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A" /><text x="550" y="149" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="bold">Preferred answers</text><text x="550" y="167" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">helpful, honest, safe</text></g>
<line x1="130" y1="96" x2="130" y2="128" marker-end="url(#arrow-5F5E5A)" stroke="#5F5E5A" stroke-width="1.5" fill="none" />
