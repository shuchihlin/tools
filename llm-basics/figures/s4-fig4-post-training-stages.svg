<text x="340" y="222" text-anchor="middle" font-size="12" fill="#5F5E5A">Prompt: "Explain DNS briefly."</text>
<rect x="40" y="240" width="180" height="56" rx="8" stroke-width="0.5" fill="#F8F7F4" stroke="#B4B2A9" />
<text x="130" y="259" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">"Explain DHCP briefly.</text>
<text x="130" y="277" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Explain ARP briefly…"</text>
<rect x="250" y="240" width="180" height="56" rx="8" stroke-width="0.5" fill="#F8F7F4" stroke="#B4B2A9" />
<text x="340" y="259" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">"DNS maps names</text>
<text x="340" y="277" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">to IP addresses…"</text>
<rect x="460" y="240" width="180" height="56" rx="8" stroke-width="0.5" fill="#F8F7F4" stroke="#B4B2A9" />
<text x="550" y="259" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Of several drafts,</text>
<text x="550" y="277" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">the clearest wins</text>
