<g><rect x="40" y="40" width="180" height="56" rx="8" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D" /><text x="130" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#712B13" font-weight="bold">Pretraining</text><text x="130" y="77" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">trillions of words</text></g>
<g><rect x="250" y="40" width="180" height="56" rx="8" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7" /><text x="340" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#3C3489" font-weight="bold">Fine-tuning (SFT)</text><text x="340" y="77" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">example chats</text></g>
<g><rect x="460" y="40" width="180" height="56" rx="8" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7" /><text x="550" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#3C3489" font-weight="bold">RLHF</text><text x="550" y="77" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">people rank answers</text></g>
