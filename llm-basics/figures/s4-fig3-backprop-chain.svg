<line x1="535" y1="122" x2="563" y2="122" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-1D9E75)" />
<text x="117" y="100" text-anchor="middle" font-size="12" fill="#5F5E5A">1</text>
<text x="262" y="100" text-anchor="middle" font-size="12" fill="#5F5E5A">2</text>
<text x="407" y="100" text-anchor="middle" font-size="12" fill="#5F5E5A">6</text>
<text x="550" y="100" text-anchor="middle" font-size="12" fill="#5F5E5A">3</text>
<text x="340" y="60" text-anchor="middle" font-size="12" fill="#5F5E5A">Forward (green): the signal, multiplied by each gain</text>
