<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 340" height="340" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><title>S4 fig3: backpropagation through a three-stage amplifier chain</title><desc>Forward: input 1 passes through gains 2, 3 and 0.5 giving 2, 6 and output 3; the target is 4. Backward: sensitivity 1 starts at the output and is multiplied by each stage's gain on the way back, giving 0.5 then 1.5. Each stage's knob gradient is incoming sensitivity times the stage's saved input: stage 3 gets 6, stage 2 gets 1, stage 1 gets 1.5.</desc>
<defs><marker id="arrow-1D9E75" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="arrow-D85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect width="680" height="340" fill="#ffffff" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker></defs>
<g><rect x="30" y="110" width="70" height="56" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A" /><text x="65" y="129" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="bold">Input</text><text x="65" y="147" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">1</text></g>
<g><rect x="135" y="110" width="110" height="56" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A" /><text x="190" y="129" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="bold">Stage 1</text><text x="190" y="147" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">gain ×2</text></g>
<g><rect x="280" y="110" width="110" height="56" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A" /><text x="335" y="129" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="bold">Stage 2</text><text x="335" y="147" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">gain ×3</text></g>
<g><rect x="425" y="110" width="110" height="56" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A" /><text x="480" y="129" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="bold">Stage 3</text><text x="480" y="147" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">gain ×0.5</text></g>
<g><rect x="565" y="110" width="80" height="56" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A" /><text x="605" y="129" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="bold">Output</text><text x="605" y="147" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">3, want 4</text></g>
<line x1="100" y1="122" x2="133" y2="122" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-1D9E75)" />
<line x1="245" y1="122" x2="278" y2="122" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-1D9E75)" />
