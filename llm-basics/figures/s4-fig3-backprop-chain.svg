<text x="262" y="185" text-anchor="middle" font-size="12" fill="#5F5E5A">1.5</text>
<line x1="190" y1="166" x2="190" y2="223" stroke="#D85A30" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow-D85A30)" />
<line x1="335" y1="166" x2="335" y2="223" stroke="#D85A30" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow-D85A30)" />
