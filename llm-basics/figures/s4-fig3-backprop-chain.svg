<g><rect x="135" y="225" width="110" height="56" rx="8" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D" /><text x="190" y="244" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#712B13" font-weight="bold">Knob gradient</text><text x="190" y="262" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">1.5 × 1 = 1.5</text></g>
<g><rect x="280" y="225" width="110" height="56" rx="8" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D" /><text x="335" y="244" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#712B13" font-weight="bold">Knob gradient</text><text x="335" y="262" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">0.5 × 2 = 1</text></g>
<g><rect x="425" y="225" width="110" height="56" rx="8" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D" /><text x="480" y="244" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#712B13" font-weight="bold">Knob gradient</text><text x="480" y="262" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">1 × 6 = 6</text></g>
<text x="340" y="310" text-anchor="middle" font-size="12" fill="#5F5E5A">Backward (orange): sensitivity flows right to left; each stage does 2 multiplies</text>
