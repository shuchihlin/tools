<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="920" height="560" fill="#fcfcfb"/>

  <text x="32" y="40" font-size="18" font-weight="600" fill="#0b0b0b">The FLOP ladder: one token through Llama 3 8B</text>
  <text x="32" y="62" font-size="13" fill="#52514e">MAC = one multiply&#8211;add. Count MACs by counting weights: each weight is used exactly once per token.</text>

  <!-- header -->
  <g font-size="12" fill="#898781">
    <text x="40" y="106">stage</text>
    <text x="300" y="106">arithmetic</text>
    <text x="640" y="106" text-anchor="end">MACs</text>
    <text x="668" y="106">observation</text>
  </g>
  <line x1="32" y1="114" x2="888" y2="114" stroke="#c3c2b7" stroke-width="1"/>

  <!-- rows -->
  <g font-size="13">
    <!-- r1 embedding -->
    <text x="40" y="140" fill="#0b0b0b">embedding lookup</text>
    <text x="300" y="140" fill="#52514e" font-family="ui-monospace, monospace">copy one row</text>
    <text x="640" y="140" fill="#0b0b0b" text-anchor="end">0</text>
    <text x="668" y="140" fill="#52514e" font-size="12">the only weights never multiplied</text>

    <!-- r2 one matmul -->
    <text x="40" y="174" fill="#0b0b0b">one [4096&#215;4096] matmul</text>
    <text x="300" y="174" fill="#52514e" font-family="ui-monospace, monospace">4096 out &#215; 4096</text>
    <text x="640" y="174" fill="#0b0b0b" text-anchor="end">16.8&#8202;M</text>
    <text x="668" y="174" fill="#52514e" font-size="12">= exactly W&#8217;s weight count</text>

    <!-- r3 attention -->
    <text x="40" y="208" fill="#0b0b0b">attention: Q, K, V, O</text>
    <text x="300" y="208" fill="#52514e" font-family="ui-monospace, monospace">2 &#215; 16.8&#8202;M + 2 &#215; 4.2&#8202;M</text>
    <text x="640" y="208" fill="#0b0b0b" text-anchor="end">41.9&#8202;M</text>
    <text x="668" y="208" fill="#52514e" font-size="12">= attention weight count</text>

    <!-- r4 MLP -->
    <text x="40" y="242" fill="#0b0b0b">MLP: gate, up, down</text>
    <text x="300" y="242" fill="#52514e" font-family="ui-monospace, monospace">3 &#215; (14336&#215;4096)</text>
    <text x="640" y="242" fill="#0b0b0b" text-anchor="end">176.2&#8202;M</text>
    <text x="668" y="242" fill="#52514e" font-size="12">= MLP weight count</text>

    <!-- r5 one layer (shaded) -->
    <rect x="32" y="256" width="856" height="30" fill="#f0efec" rx="4"/>
    <text x="40" y="276" fill="#0b0b0b" font-weight="600">one layer</text>
    <text x="300" y="276" fill="#52514e" font-family="ui-monospace, monospace">41.9 + 176.2</text>
    <text x="640" y="276" fill="#0b0b0b" text-anchor="end" font-weight="600">218.1&#8202;M</text>
    <text x="668" y="276" fill="#52514e" font-size="12">= layer weight count (fig. 2)</text>

    <!-- r6 all layers -->
    <text x="40" y="310" fill="#0b0b0b">all layers</text>
    <text x="300" y="310" fill="#52514e" font-family="ui-monospace, monospace">&#215; 32</text>
    <text x="640" y="310" fill="#0b0b0b" text-anchor="end">6,979&#8202;M</text>
    <text x="668" y="310" fill="#52514e" font-size="12">= all layer weights</text>

    <!-- r7 head -->
    <text x="40" y="344" fill="#0b0b0b">output head [128256&#215;4096]</text>
    <text x="300" y="344" fill="#52514e" font-family="ui-monospace, monospace">128256 out &#215; 4096</text>
    <text x="640" y="344" fill="#0b0b0b" text-anchor="end">525.3&#8202;M</text>
    <text x="668" y="344" fill="#52514e" font-size="12">= head weight count</text>

    <!-- r8 total (shaded) -->
    <rect x="32" y="358" width="856" height="30" fill="#f0efec" rx="4"/>
    <text x="40" y="378" fill="#0b0b0b" font-weight="600">per-token total</text>
    <text x="300" y="378" fill="#52514e" font-family="ui-monospace, monospace">6,979 + 525</text>
    <text x="640" y="378" fill="#0b0b0b" text-anchor="end" font-weight="600">7,505&#8202;M MACs</text>
    <text x="668" y="378" fill="#52514e" font-size="12">&#8776; every non-embedding weight, once</text>

    <!-- r9 FLOPs -->
    <text x="40" y="412" fill="#0b0b0b">in FLOPs</text>
    <text x="300" y="412" fill="#52514e" font-family="ui-monospace, monospace">&#215; 2 (mul + add)</text>
    <text x="640" y="412" fill="#0b0b0b" text-anchor="end" font-weight="600">&#8776; 15.0&#8202;G</text>
    <text x="668" y="412" fill="#52514e" font-size="12">&#8776; 2 &#215; params: the rule of thumb</text>
  </g>

  <line x1="32" y1="440" x2="888" y2="440" stroke="#e1e0d9" stroke-width="1"/>

  <text x="32" y="470" font-size="14" fill="#0b0b0b">Why the rule works: a dot product uses each weight in the row <tspan font-weight="600">once</tspan>. Every row of every matrix is used</text>
  <text x="32" y="492" font-size="14" fill="#0b0b0b">once per token. So MACs per token = weight count, and FLOPs &#8776; 2 &#215; parameters &#8212; for any matmul-dominated model.</text>
  <text x="32" y="524" font-size="12.5" fill="#898781">Not counted: attention-score arithmetic (Q&#183;K, weighted sum of V) &#8212; it scales with context length, not parameter count.</text>
  <text x="32" y="542" font-size="12.5" fill="#898781">Negligible at short contexts; becomes the story at long ones. Session 3.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
