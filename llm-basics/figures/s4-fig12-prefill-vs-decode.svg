<path d="M585 236 L585 258 L68 258 L68 229" fill="none" marker-end="url(#arrow-5F5E5A)" stroke="#5F5E5A" stroke-width="1.5" />
<text x="340" y="280" text-anchor="middle" font-size="12" fill="#5F5E5A">↻ repeat for every new token</text>
<text x="340" y="305" text-anchor="middle" font-size="12" fill="#5F5E5A">bandwidth-bound: all weights read for each single token</text>
