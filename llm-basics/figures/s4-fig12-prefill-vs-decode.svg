<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 330" height="330" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><title>S4 fig12: prefill vs. decode</title><desc>Prefill: all five prompt tokens go through the model in one pass, filling the KV cache and producing the first new token; compute-bound because one read of the weights serves many tokens. Decode: one token per pass, appended to the KV cache, repeated for every new token; bandwidth-bound because all weights are read for each single token.</desc>
<defs><marker id="arrow-5F5E5A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect width="680" height="330" fill="#ffffff" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker></defs>
<text x="40" y="52" font-size="14" fill="#2C2C2A" font-weight="bold">Prefill</text>
<g><rect x="40" y="70" width="56" height="36" rx="6" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7" /><text x="68" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">The</text></g>
<g><rect x="100" y="70" width="56" height="36" rx="6" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7" /><text x="128" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">cat</text></g>
<g><rect x="160" y="70" width="56" height="36" rx="6" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7" /><text x="188" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">sat</text></g>
<g><rect x="220" y="70" width="56" height="36" rx="6" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7" /><text x="248" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">on</text></g>
<g><rect x="280" y="70" width="56" height="36" rx="6" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7" /><text x="308" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">the</text></g>
<line x1="336" y1="88" x2="378" y2="88" marker-end="url(#arrow-5F5E5A)" stroke="#5F5E5A" stroke-width="1.5" fill="none" />
<g><rect x="380" y="60" width="120" height="56" rx="8" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7" /><text x="440" y="79" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#3C3489" font-weight="bold">One pass</text><text x="440" y="97" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">all 5 at once</text></g>
<line x1="500" y1="88" x2="528" y2="88" marker-end="url(#arrow-5F5E5A)" stroke="#5F5E5A" stroke-width="1.5" fill="none" />
<g><rect x="530" y="60" width="110" height="56" rx="8" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7" /><text x="585" y="79" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#3C3489" font-weight="bold">KV cache</text><text x="585" y="97" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">+ first token</text></g>
<text x="340" y="140" text-anchor="middle" font-size="12" fill="#5F5E5A">compute-bound: one read of the weights serves many tokens</text>
<text x="40" y="172" font-size="14" fill="#2C2C2A" font-weight="bold">Decode</text>
<g><rect x="40" y="190" width="56" height="36" rx="6" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56" /><text x="68" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">mat</text></g>
<line x1="96" y1="208" x2="378" y2="208" marker-end="url(#arrow-5F5E5A)" stroke="#5F5E5A" stroke-width="1.5" fill="none" />
<g><rect x="380" y="180" width="120" height="56" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56" /><text x="440" y="199" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#085041" font-weight="bold">One pass</text><text x="440" y="217" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">1 token only</text></g>
