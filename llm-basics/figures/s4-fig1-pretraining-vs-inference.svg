<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 420" height="420" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><title>S4 fig1: pretraining loop vs. inference path</title><desc>Top: pretraining loop of text sample, model guess, grading against the real word, and nudging weights, repeated trillions of times, which writes the weights. Bottom: inference reads the weights in one forward pass to produce the next word.</desc>
<defs><marker id="arrow-5F5E5A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect width="680" height="420" fill="#ffffff" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker></defs>
<rect x="30" y="40" width="620" height="150" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4" />
<text x="48" y="64" font-size="14" fill="#2C2C2A" font-weight="bold">Pretraining: writes the weights (once, for months)</text>
<g><rect x="40" y="85" width="135" height="56" rx="8" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D" /><text x="107" y="104" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#712B13" font-weight="bold">Text sample</text><text x="107" y="122" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">sat on the ___</text></g>
<g><rect x="195" y="85" width="135" height="56" rx="8" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D" /><text x="262" y="104" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#712B13" font-weight="bold">Model guesses</text><text x="262" y="122" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">mat 40%, rug 20%</text></g>
<g><rect x="350" y="85" width="135" height="56" rx="8" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D" /><text x="417" y="104" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#712B13" font-weight="bold">Grade it</text><text x="417" y="122" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">real word: mat</text></g>
<g><rect x="505" y="85" width="135" height="56" rx="8" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D" /><text x="572" y="104" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#712B13" font-weight="bold">Nudge weights</text><text x="572" y="122" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">tiny step each</text></g>
<line x1="175" y1="113" x2="193" y2="113" marker-end="url(#arrow-5F5E5A)" stroke="#5F5E5A" stroke-width="1.5" fill="none" />
<line x1="330" y1="113" x2="348" y2="113" marker-end="url(#arrow-5F5E5A)" stroke="#5F5E5A" stroke-width="1.5" fill="none" />
<line x1="485" y1="113" x2="503" y2="113" marker-end="url(#arrow-5F5E5A)" stroke="#5F5E5A" stroke-width="1.5" fill="none" />
<text x="300" y="170" text-anchor="middle" font-size="12" fill="#5F5E5A">↻ repeat over trillions of words, on thousands of GPUs</text>
<g><rect x="240" y="215" width="200" height="44" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A" /><text x="340" y="237" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="bold">Weights (the table)</text></g>
<path d="M572 141 L572 237 L442 237" fill="none" marker-end="url(#arrow-5F5E5A)" stroke="#5F5E5A" stroke-width="1.5" />
<rect x="30" y="285" width="620" height="105" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4" />
<text x="48" y="306" font-size="14" fill="#2C2C2A" font-weight="bold">Inference: reads only (every question)</text>
<g><rect x="70" y="325" width="150" height="44" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56" /><text x="145" y="347" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#085041" font-weight="bold">Your prompt</text></g>
<g><rect x="265" y="325" width="150" height="44" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56" /><text x="340" y="347" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#085041" font-weight="bold">Forward pass</text></g>
<g><rect x="460" y="325" width="150" height="44" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56" /><text x="535" y="347" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#085041" font-weight="bold">Next word</text></g>
<line x1="220" y1="347" x2="263" y2="347" marker-end="url(#arrow-5F5E5A)" stroke="#5F5E5A" stroke-width="1.5" fill="none" />
<line x1="415" y1="347" x2="458" y2="347" marker-end="url(#arrow-5F5E5A)" stroke="#5F5E5A" stroke-width="1.5" fill="none" />
<line x1="340" y1="259" x2="340" y2="323" stroke-dasharray="3 3" marker-end="url(#arrow-5F5E5A)" stroke="#5F5E5A" stroke-width="1.5" fill="none" />
