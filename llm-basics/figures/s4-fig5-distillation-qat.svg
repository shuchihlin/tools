<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 360" height="360" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><title>S4 fig5: distillation and quantization-aware training</title><desc>Top: a large teacher model produces a full probability spread over next words (mat 40 percent, rug 20, floor 15, car near zero) which a small student learns to match, instead of the answer key that gives mat 100 percent. Bottom: quantization-aware training rounds master weights to 4-bit, runs and grades the model with the rounding included, then nudges the master weights, repeating; only the 4-bit version is shipped.</desc>
<defs><marker id="arrow-5F5E5A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect width="680" height="360" fill="#ffffff" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker></defs>
<text x="40" y="50" font-size="14" fill="#2C2C2A" font-weight="bold">Distillation</text>
<g><rect x="40" y="70" width="140" height="56" rx="8" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7" /><text x="110" y="89" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#3C3489" font-weight="bold">Teacher</text><text x="110" y="107" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">big, e.g. 70B</text></g>
<line x1="180" y1="98" x2="228" y2="98" marker-end="url(#arrow-5F5E5A)" stroke="#5F5E5A" stroke-width="1.5" fill="none" />
<text x="240" y="76" dominant-baseline="central" font-size="12" fill="#5F5E5A">mat</text>
<rect x="290" y="70" width="120" height="12" rx="2" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D" />
<text x="416" y="76" dominant-baseline="central" font-size="12" fill="#5F5E5A">40%</text>
<text x="240" y="94" dominant-baseline="central" font-size="12" fill="#5F5E5A">rug</text>
<rect x="290" y="88" width="60" height="12" rx="2" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D" />
<text x="356" y="94" dominant-baseline="central" font-size="12" fill="#5F5E5A">20%</text>
<text x="240" y="112" dominant-baseline="central" font-size="12" fill="#5F5E5A">floor</text>
<rect x="290" y="106" width="45" height="12" rx="2" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D" />
<text x="341" y="112" dominant-baseline="central" font-size="12" fill="#5F5E5A">15%</text>
<text x="240" y="130" dominant-baseline="central" font-size="12" fill="#5F5E5A">car</text>
<rect x="290" y="124" width="3" height="12" rx="1" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D" />
<text x="299" y="130" dominant-baseline="central" font-size="12" fill="#5F5E5A">~0%</text>
<line x1="455" y1="98" x2="498" y2="98" marker-end="url(#arrow-5F5E5A)" stroke="#5F5E5A" stroke-width="1.5" fill="none" />
<g><rect x="500" y="70" width="140" height="56" rx="8" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7" /><text x="570" y="89" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#3C3489" font-weight="bold">Student</text><text x="570" y="107" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">small, e.g. 8B</text></g>
<text x="340" y="170" text-anchor="middle" font-size="12" fill="#5F5E5A">Student copies the whole spread, not just the answer key (mat 100%, rest 0)</text>
<line x1="40" y1="200" x2="640" y2="200" stroke="#B4B2A9" stroke-width="0.5" />
<text x="40" y="235" font-size="14" fill="#2C2C2A" font-weight="bold">Quantization-aware training (QAT)</text>
<g><rect x="40" y="250" width="135" height="56" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A" /><text x="107" y="269" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="bold">Master weights</text><text x="107" y="287" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">precise copy</text></g>
<g><rect x="195" y="250" width="135" height="56" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A" /><text x="262" y="269" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="bold">Round to 4-bit</text><text x="262" y="287" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">16 levels</text></g>
<g><rect x="350" y="250" width="135" height="56" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A" /><text x="417" y="269" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="bold">Run and grade</text><text x="417" y="287" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">error included</text></g>
<g><rect x="505" y="250" width="135" height="56" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A" /><text x="572" y="269" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#444441" font-weight="bold">Nudge master</text><text x="572" y="287" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">learns tolerance</text></g>
<line x1="175" y1="278" x2="193" y2="278" marker-end="url(#arrow-5F5E5A)" stroke="#5F5E5A" stroke-width="1.5" fill="none" />
<line x1="330" y1="278" x2="348" y2="278" marker-end="url(#arrow-5F5E5A)" stroke="#5F5E5A" stroke-width="1.5" fill="none" />
<line x1="485" y1="278" x2="503" y2="278" marker-end="url(#arrow-5F5E5A)" stroke="#5F5E5A" stroke-width="1.5" fill="none" />
<text x="340" y="336" text-anchor="middle" font-size="12" fill="#5F5E5A">↻ repeat; ship only the 4-bit version</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>