<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="920" height="520" fill="#fcfcfb"/>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#898781"/>
    </marker>
  </defs>

  <text x="32" y="40" font-size="18" font-weight="600" fill="#0b0b0b">Anatomy of one transformer layer (&#215;32)</text>
  <text x="32" y="62" font-size="13" fill="#52514e">Blue boxes are all the same operation: a per-token matmul. Orange is the one place positions interact.</text>

  <!-- Row 1: attention -->
  <text x="32" y="150" font-size="12.5" fill="#52514e">from previous</text>
  <text x="32" y="166" font-size="12.5" fill="#52514e">layer [&#183;&#215;4096]</text>
  <line x1="120" y1="160" x2="148" y2="160" stroke="#898781" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Q K V boxes -->
  <g>
    <rect x="152" y="98"  width="118" height="34" fill="#9ec5f4" rx="5"/>
    <rect x="152" y="143" width="118" height="34" fill="#9ec5f4" rx="5"/>
    <rect x="152" y="188" width="118" height="34" fill="#9ec5f4" rx="5"/>
    <g font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-family="ui-monospace, monospace">
      <text x="211" y="119">Q (query)</text>
      <text x="211" y="164">K (key)</text>
      <text x="211" y="209">V (value)</text>
    </g>
  </g>
  <!-- fan from input to QKV -->
  <g stroke="#898781" stroke-width="1.2" fill="none">
    <line x1="148" y1="160" x2="152" y2="115"/>
    <line x1="148" y1="160" x2="152" y2="205"/>
  </g>

  <!-- arrows QKV to core -->
  <g stroke="#898781" stroke-width="1.5" marker-end="url(#ar)">
    <line x1="270" y1="115" x2="306" y2="130"/>
    <line x1="270" y1="160" x2="306" y2="160"/>
    <line x1="270" y1="205" x2="306" y2="190"/>
  </g>

  <!-- attention core -->
  <rect x="310" y="98" width="200" height="124" fill="#eb6834" rx="6"/>
  <g text-anchor="middle" fill="#ffffff">
    <text x="410" y="140" font-size="13.5" font-weight="600">attention core</text>
    <text x="410" y="162" font-size="12">positions interact here</text>
    <text x="410" y="180" font-size="12">no weights &#8212; Session 3</text>
  </g>

  <line x1="510" y1="160" x2="546" y2="160" stroke="#898781" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- O box -->
  <rect x="550" y="143" width="118" height="34" fill="#9ec5f4" rx="5"/>
  <text x="609" y="164" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-family="ui-monospace, monospace">O (output)</text>

  <line x1="668" y1="160" x2="706" y2="160" stroke="#898781" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- residual add 1 -->
  <circle cx="724" cy="160" r="15" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
  <text x="724" y="166" font-size="16" fill="#0b0b0b" text-anchor="middle">+</text>
  <line x1="724" y1="105" x2="724" y2="143" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="724" y="96" font-size="11.5" fill="#898781" text-anchor="middle">skip: layer input, unchanged</text>

  <!-- route to row 2 -->
  <polyline points="724,175 724,248 92,248 92,342 116,342" fill="none" stroke="#898781" stroke-width="1.5"/>
  <g stroke="#898781" stroke-width="1.2" fill="none">
    <polyline points="116,342 128,342 128,317 148,317"/>
    <polyline points="116,342 128,342 128,367 148,367"/>
  </g>

  <!-- Row 2: MLP -->
  <g>
    <rect x="152" y="300" width="134" height="34" fill="#9ec5f4" rx="5"/>
    <rect x="152" y="350" width="134" height="34" fill="#9ec5f4" rx="5"/>
    <g font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-family="ui-monospace, monospace">
      <text x="219" y="321">gate [14336&#215;4096]</text>
      <text x="219" y="371">up [14336&#215;4096]</text>
    </g>
  </g>

  <g stroke="#898781" stroke-width="1.5" marker-end="url(#ar)">
    <line x1="286" y1="317" x2="322" y2="333"/>
    <line x1="286" y1="367" x2="322" y2="351"/>
  </g>

  <!-- SiLU elementwise -->
  <rect x="326" y="325" width="112" height="34" fill="#f0efec" rx="5"/>
  <text x="382" y="346" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-family="ui-monospace, monospace">SiLU(g) &#8857; u</text>
  <text x="382" y="404" font-size="11" fill="#898781" text-anchor="middle">elementwise nonlinearity</text>
  <text x="382" y="419" font-size="11" fill="#898781" text-anchor="middle">no weights &#8212; [14336] wide</text>

  <line x1="438" y1="342" x2="474" y2="342" stroke="#898781" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- down -->
  <rect x="478" y="325" width="140" height="34" fill="#9ec5f4" rx="5"/>
  <text x="548" y="346" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-family="ui-monospace, monospace">down [4096&#215;14336]</text>

  <line x1="618" y1="342" x2="654" y2="342" stroke="#898781" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- residual add 2 -->
  <circle cx="672" cy="342" r="15" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
  <text x="672" y="348" font-size="16" fill="#0b0b0b" text-anchor="middle">+</text>
  <line x1="672" y1="288" x2="672" y2="325" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="672" y="279" font-size="11.5" fill="#898781" text-anchor="middle">skip: MLP input, unchanged</text>

  <line x1="687" y1="342" x2="740" y2="342" stroke="#898781" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="748" y="338" font-size="12.5" fill="#52514e">to next layer</text>
  <text x="748" y="354" font-size="12.5" fill="#52514e" font-family="ui-monospace, monospace">[&#183;&#215;4096]</text>

  <!-- Legend -->
  <line x1="32" y1="444" x2="888" y2="444" stroke="#e1e0d9" stroke-width="1"/>
  <g font-size="12.5">
    <rect x="32" y="462" width="14" height="14" fill="#9ec5f4" rx="3"/>
    <text x="54" y="474" fill="#52514e">per-token matmul &#8212; holds ALL the layer&#8217;s weights (7 matrices)</text>
    <rect x="440" y="462" width="14" height="14" fill="#eb6834" rx="3"/>
    <text x="462" y="474" fill="#52514e">cross-position mixing, weight-free</text>
    <rect x="700" y="462" width="14" height="14" fill="#f0efec" rx="3"/>
    <text x="722" y="474" fill="#52514e">elementwise, weight-free</text>
  </g>
  <text x="32" y="504" font-size="11.5" fill="#898781">Small per-block normalization steps omitted for clarity (the two 4,096-float norm vectors from fig. 2).</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
