<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="920" height="430" fill="#fcfcfb"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#898781"/>
    </marker>
  </defs>

  <text x="32" y="40" font-size="18" font-weight="600" fill="#0b0b0b">d_model = the fixed width of the vector stream flowing through the model</text>
  <text x="32" y="62" font-size="13" fill="#52514e">One vector of 4,096 numbers per token position. Every layer reads that shape and writes that shape.</text>

  <!-- Tokens -->
  <g font-size="13" fill="#0b0b0b" text-anchor="end">
    <text x="95" y="150">The</text>
    <text x="95" y="190">router</text>
    <text x="95" y="230">drops</text>
  </g>
  <g stroke="#898781" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="102" y1="146" x2="126" y2="146"/>
    <line x1="102" y1="186" x2="126" y2="186"/>
    <line x1="102" y1="226" x2="126" y2="226"/>
  </g>

  <!-- Embedding box -->
  <rect x="130" y="110" width="122" height="150" fill="#f0efec" rx="6"/>
  <text x="191" y="172" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">embedding</text>
  <text x="191" y="192" font-size="11.5" fill="#52514e" text-anchor="middle" font-family="ui-monospace, monospace">[128256 &#215; 4096]</text>
  <text x="191" y="212" font-size="11.5" fill="#898781" text-anchor="middle">row lookup</text>

  <line x1="252" y1="185" x2="282" y2="185" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Vector group A -->
  <g fill="#2a78d6">
    <rect x="290" y="120" width="18" height="16" rx="2"/><rect x="290" y="138" width="18" height="16" rx="2"/><rect x="290" y="156" width="18" height="16" rx="2"/><rect x="290" y="174" width="18" height="16" rx="2"/><rect x="290" y="192" width="18" height="16" rx="2"/>
    <rect x="314" y="120" width="18" height="16" rx="2"/><rect x="314" y="138" width="18" height="16" rx="2"/><rect x="314" y="156" width="18" height="16" rx="2"/><rect x="314" y="174" width="18" height="16" rx="2"/><rect x="314" y="192" width="18" height="16" rx="2"/>
    <rect x="338" y="120" width="18" height="16" rx="2"/><rect x="338" y="138" width="18" height="16" rx="2"/><rect x="338" y="156" width="18" height="16" rx="2"/><rect x="338" y="174" width="18" height="16" rx="2"/><rect x="338" y="192" width="18" height="16" rx="2"/>
  </g>
  <text x="323" y="226" font-size="14" fill="#898781" text-anchor="middle">&#8942;</text>
  <text x="323" y="252" font-size="12" fill="#52514e" text-anchor="middle" font-family="ui-monospace, monospace">[3 &#215; 4096]</text>

  <line x1="366" y1="185" x2="396" y2="185" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Layer 1 box -->
  <rect x="400" y="110" width="120" height="150" fill="#9ec5f4" rx="6"/>
  <text x="460" y="168" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">layer 1</text>
  <text x="460" y="192" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-family="ui-monospace, monospace">in&#160;&#160;[&#183; &#215; 4096]</text>
  <text x="460" y="210" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-family="ui-monospace, monospace">out [&#183; &#215; 4096]</text>

  <line x1="520" y1="185" x2="550" y2="185" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Vector group B -->
  <g fill="#2a78d6">
    <rect x="558" y="120" width="18" height="16" rx="2"/><rect x="558" y="138" width="18" height="16" rx="2"/><rect x="558" y="156" width="18" height="16" rx="2"/><rect x="558" y="174" width="18" height="16" rx="2"/><rect x="558" y="192" width="18" height="16" rx="2"/>
    <rect x="582" y="120" width="18" height="16" rx="2"/><rect x="582" y="138" width="18" height="16" rx="2"/><rect x="582" y="156" width="18" height="16" rx="2"/><rect x="582" y="174" width="18" height="16" rx="2"/><rect x="582" y="192" width="18" height="16" rx="2"/>
    <rect x="606" y="120" width="18" height="16" rx="2"/><rect x="606" y="138" width="18" height="16" rx="2"/><rect x="606" y="156" width="18" height="16" rx="2"/><rect x="606" y="174" width="18" height="16" rx="2"/><rect x="606" y="192" width="18" height="16" rx="2"/>
  </g>
  <text x="591" y="226" font-size="14" fill="#898781" text-anchor="middle">&#8942;</text>
  <text x="591" y="252" font-size="12" fill="#52514e" text-anchor="middle" font-family="ui-monospace, monospace">[3 &#215; 4096]</text>

  <line x1="634" y1="185" x2="664" y2="185" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Layers 2..32 box -->
  <rect x="668" y="110" width="120" height="150" fill="#9ec5f4" rx="6"/>
  <text x="728" y="168" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">layers 2 &#8230; 32</text>
  <text x="728" y="192" font-size="11.5" fill="#0b0b0b" text-anchor="middle">same shape</text>
  <text x="728" y="210" font-size="11.5" fill="#0b0b0b" text-anchor="middle">in and out</text>

  <line x1="788" y1="185" x2="818" y2="185" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="852" y="180" font-size="12" fill="#52514e" text-anchor="middle" font-family="ui-monospace, monospace">still</text>
  <text x="852" y="198" font-size="12" fill="#52514e" text-anchor="middle" font-family="ui-monospace, monospace">[3&#215;4096]</text>

  <!-- Divider -->
  <line x1="32" y1="290" x2="888" y2="290" stroke="#e1e0d9" stroke-width="1"/>

  <text x="32" y="322" font-size="14" fill="#0b0b0b">Nearly every weight matrix has d_model on <tspan font-weight="600">both</tspan> dimensions ([d&#215;d]) or one-and-a-bit ([d &#215; 3.5d])</text>
  <text x="32" y="344" font-size="14" fill="#0b0b0b">&#8594; parameters per layer grow &#8776; <tspan font-weight="600">d&#178;</tspan>. Width is quadratic; depth is linear.</text>
  <text x="32" y="380" font-size="13" fill="#52514e" font-family="ui-monospace, monospace">Llama 3 8B &#8594; 70B: d 4096&#8594;8192, layers 32&#8594;80  &#8658;  (8192/4096)&#178; &#215; (80/32) = 4 &#215; 2.5 = 10&#215; the layer weights</text>
  <text x="32" y="408" font-size="13" fill="#898781">Bus analogy: d_model is the backplane width every layer connects to &#8212; change it and every card needs redesigning.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
