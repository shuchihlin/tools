<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1150" viewBox="0 0 760 1150" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .title { font-size: 17px; font-weight: 600; fill: #1a1a2e; }
    .sub   { font-size: 12px; fill: #555; }
    .small { font-size: 11px; fill: #444; }
    .tiny  { font-size: 10px; fill: #555; }
    .mono  { font-family: Consolas, monospace; font-size: 12.5px; fill: #1a1a2e; }
    .monosm{ font-family: Consolas, monospace; font-size: 10.5px; fill: #444; }
    .hdr   { font-size: 13px; font-weight: 600; fill: #1a1a2e; }
  </style>
  <rect width="760" height="1150" fill="#ffffff"/>

  <text x="20" y="30" class="title">The payoff — and why the idle ALUs make it free</text>
  <text x="20" y="50" class="sub">Every number in part 4 was multiplied by BYTES PER PARAMETER. This is the term quantization attacks.</text>

  <!-- ===== A: the ledger table ===== -->
  <text x="20" y="86" class="hdr">A — Llama 3 8B on one H100 (3.35 TB/s), batch 1</text>

  <rect x="40" y="100" width="680" height="128" rx="6" fill="#ffffff" stroke="#c9d4dd"/>
  <text x="56"  y="122" class="monosm" font-weight="600">format     B/param    streamed     stream time    tok/s ceiling</text>
  <line x1="56" y1="130" x2="704" y2="130" stroke="#c9d4dd"/>
  <text x="56"  y="152" class="monosm">FP16          2.0      15.0 GB       4.48 ms         ~223</text>
  <text x="56"  y="174" class="monosm">INT8          1.0       7.5 GB       2.24 ms         ~446      ← 2×</text>
  <text x="56"  y="196" class="monosm">INT4          0.5      3.75 GB       1.12 ms         ~893      ← 4×</text>
  <line x1="56" y1="204" x2="704" y2="204" stroke="#c9d4dd"/>
  <text x="56"  y="222" class="small">Linear, with no asterisk — decode time IS the weight stream, so halving bytes halves the clock.</text>

  <!-- 70B -->
  <text x="20" y="266" class="hdr">B — The 70B case: INT4 turns a multi-GPU deployment into one card</text>
  <rect x="40" y="280" width="680" height="118" rx="6" fill="#f4f7fa" stroke="#c9d4dd"/>
  <text x="56" y="302" class="monosm">FP16  140 GB  →  2 × 80 GB cards minimum  |  41.8 ms/token  |  ~24 tok/s</text>
  <text x="56" y="326" class="monosm">INT4   35 GB  →  ONE 80 GB card           |  10.4 ms/token  |  ~96 tok/s</text>
  <text x="56" y="352" class="small">…with 45 GB left over for KV caches. The per-layer network tax between GPUs disappears entirely.</text>
  <text x="56" y="374" class="small">Same lever at the other end of the scale: 8B INT4 ≈ 4 GB fits a laptop GPU. This is why local LLMs exist.</text>

  <!-- ===== C: the key insight ===== -->
  <text x="20" y="438" class="hdr">C — The key insight: dequantization is FREE because the ALUs were idle</text>

  <rect x="40" y="452" width="680" height="200" rx="8" fill="#eef5f9" stroke="#0b6e99" stroke-width="2"/>

  <text x="56" y="476" class="small">A weight-only kernel does this per weight:</text>
  <text x="56" y="500" class="mono">read 1 INT4 nibble from HBM  →  unpack + multiply by scale → FP16  →  do the MAC</text>

  <line x1="56" y1="516" x2="704" y2="516" stroke="#c9d4dd"/>

  <text x="56" y="540" class="monosm" font-weight="600">                        bytes/token      FLOPs/token        intensity</text>
  <text x="56" y="562" class="monosm">FP16, no dequant           15.0 GB        15.0 GFLOPs            1.0</text>
  <text x="56" y="584" class="monosm">INT4 + dequant             3.75 GB      ~22.5 GFLOPs            6.0</text>
  <line x1="56" y1="594" x2="704" y2="594" stroke="#c9d4dd"/>
  <text x="56" y="616" class="small" font-weight="600">Intensity went 1 → 6.0. The ridge is 295. We are still nowhere near compute-bound.</text>
  <text x="56" y="640" class="small">The ALUs were 99.7% idle (part 4). The unpacking is paid out of that idle capacity — it costs no wall clock.</text>

  <!-- ===== D: which phase ===== -->
  <text x="20" y="690" class="hdr">D — But that logic only holds for DECODE. Prefill needs a different kind of quantization.</text>

  <rect x="40" y="706" width="330" height="178" rx="6" fill="#eef5f9" stroke="#0b6e99"/>
  <text x="56" y="729" class="small" font-weight="600">WEIGHT-ONLY  (W4A16, W8A16)</text>
  <text x="56" y="750" class="small">Weights stored small, unpacked to FP16;</text>
  <text x="56" y="767" class="small">the matmul still runs in FP16.</text>
  <text x="56" y="791" class="small">Fixes: stream time, residency.</text>
  <text x="56" y="812" class="small" font-weight="600">→ speeds up DECODE (bandwidth-bound)</text>
  <text x="56" y="833" class="small" font-weight="600">→ does NOT speed up prefill</text>
  <text x="56" y="856" class="small">(prefill is already compute-bound; the</text>
  <text x="56" y="873" class="small">dequant work makes it slightly worse)</text>

  <rect x="390" y="706" width="330" height="178" rx="6" fill="#fdf3e7" stroke="#d9b98a"/>
  <text x="406" y="729" class="small" font-weight="600">WEIGHT + ACTIVATION  (W8A8, FP8)</text>
  <text x="406" y="750" class="small">Both operands narrow, so the matmul runs</text>
  <text x="406" y="767" class="small">on tensor cores at ~2× the FP16 rate.</text>
  <text x="406" y="791" class="small">Fixes: stream time, residency, AND FLOPs.</text>
  <text x="406" y="812" class="small" font-weight="600">→ speeds up PREFILL too</text>
  <text x="406" y="833" class="small" font-weight="600">→ but must survive activation outliers</text>
  <text x="406" y="856" class="small">(the hard part — hence SmoothQuant,</text>
  <text x="406" y="873" class="small">mixed decomposition, FP8's wider range)</text>

  <rect x="40" y="896" width="680" height="46" rx="6" fill="#f4f7fa" stroke="#c9d4dd"/>
  <text x="56" y="916" class="small">Which is why the two deployments differ: a local single-user setup runs weight-only INT4 (latency + fitting in VRAM);</text>
  <text x="56" y="932" class="small">a high-throughput server runs FP8/W8A8 (prefill throughput + bigger batches). Different bottleneck, different tool.</text>

  <!-- ===== E: KV cache ===== -->
  <text x="20" y="980" class="hdr">E — The third ledger: quantize the KV cache and the batch ceiling rises</text>
  <rect x="40" y="994" width="680" height="76" rx="6" fill="#f0f7f0" stroke="#4a8a4a"/>
  <text x="56" y="1016" class="monosm">FP16 weights + FP16 KV:  (80 − 16.1) GB ÷ 0.268 GB/req  ≈  238 requests  @ 2048 ctx</text>
  <text x="56" y="1040" class="monosm">INT4 weights + INT8 KV:  (80 −  4.0) GB ÷ 0.134 GB/req  ≈  566 requests  @ 2048 ctx</text>
  <text x="56" y="1062" class="small">2.4× the batch → 2.4× the weight-stream amortization, on top of the 4× from the weights themselves.</text>

  <!-- footer -->
  <rect x="40" y="1086" width="680" height="52" rx="6" fill="#fdf3e7" stroke="#d9b98a"/>
  <text x="56" y="1106" class="small" font-weight="600">Honest ledger note: 4-bit is never exactly 4 bits.</text>
  <text x="56" y="1126" class="monosm">INT4 + one FP16 scale per group of 64 = 4 + 16/64 = 4.25 bits/weight (4.5 with a zero-point).</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
