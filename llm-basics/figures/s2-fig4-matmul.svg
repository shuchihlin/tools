<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="920" height="520" fill="#fcfcfb"/>

  <text x="32" y="40" font-size="18" font-weight="600" fill="#0b0b0b">Inference is one operation repeated: y = W&#183;x</text>
  <text x="32" y="62" font-size="13" fill="#52514e">Each output element is a dot product: one weight row against the incoming token vector.</text>

  <!-- Panel A: matrix-vector product -->
  <rect x="60" y="120" width="220" height="220" fill="#9ec5f4" rx="4"/>
  <rect x="60" y="196" width="220" height="18" fill="#eb6834"/>
  <text x="52" y="209" font-size="12" fill="#52514e" text-anchor="end">row i</text>
  <text x="170" y="364" font-size="12.5" fill="#52514e" text-anchor="middle" font-family="ui-monospace, monospace">W [4096 &#215; 4096]</text>

  <text x="303" y="238" font-size="18" fill="#0b0b0b" text-anchor="middle">&#215;</text>

  <rect x="325" y="120" width="22" height="220" fill="#2a78d6" rx="4"/>
  <text x="336" y="364" font-size="12.5" fill="#52514e" text-anchor="middle" font-family="ui-monospace, monospace">x [4096]</text>

  <text x="372" y="238" font-size="18" fill="#0b0b0b" text-anchor="middle">=</text>

  <rect x="392" y="120" width="22" height="220" fill="#9ec5f4" rx="4"/>
  <rect x="392" y="196" width="22" height="18" fill="#eb6834"/>
  <text x="403" y="364" font-size="12.5" fill="#52514e" text-anchor="middle" font-family="ui-monospace, monospace">y [4096]</text>

  <!-- Panel B: FLOP budget -->
  <g font-size="13.5" fill="#0b0b0b">
    <text x="470" y="140" font-family="ui-monospace, monospace" font-weight="600">y[i] = &#931;&#8342; W[i,j] &#183; x[j]</text>
    <text x="470" y="172">one output element = 4,096 multiply&#8211;adds</text>
    <text x="470" y="198">one [4096&#215;4096] matmul = 33.6&#8202;M FLOPs</text>
    <text x="470" y="224">one layer (7 matmuls) &#8776; 436&#8202;M FLOPs</text>
    <text x="470" y="250">&#215; 32 layers + output head &#8776; <tspan font-weight="600">15.0 GFLOPs per generated token</tspan></text>
  </g>

  <rect x="470" y="268" width="418" height="38" fill="#f0efec" rx="6"/>
  <text x="679" y="292" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">rule of thumb: FLOPs per token &#8776; 2 &#215; parameter count</text>

  <text x="470" y="338" font-size="12.5" fill="#52514e">where inference compute goes:</text>
  <rect x="470" y="346" width="409" height="32" fill="#2a78d6" rx="3"/>
  <rect x="881" y="346" width="7" height="32" fill="#eb6834" rx="2"/>
  <text x="480" y="366" font-size="12.5" fill="#ffffff">dense matmul &#8776; 99%</text>
  <line x1="884" y1="378" x2="884" y2="392" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="888" y="406" font-size="12" fill="#52514e" text-anchor="end">everything else &#8212; softmax, norms, SiLU: element-wise, O(d) not O(d&#178;), &#8804;1%</text>

  <!-- Divider + takeaway -->
  <line x1="32" y1="432" x2="888" y2="432" stroke="#e1e0d9" stroke-width="1"/>
  <text x="32" y="462" font-size="14" fill="#0b0b0b">No branches, no table lookups, no data-dependent control flow &#8212; a <tspan font-weight="600">fixed pipeline of dense multiply&#8211;adds</tspan>.</text>
  <text x="32" y="486" font-size="14" fill="#0b0b0b">The intelligence is in the <tspan font-weight="600">operands</tspan> (weights), not the operations. Same shape every token, every request.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
