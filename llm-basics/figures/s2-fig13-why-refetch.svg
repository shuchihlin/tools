<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1030" viewBox="0 0 760 1030" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .title { font-size: 17px; font-weight: 600; fill: #1a1a2e; }
    .sub   { font-size: 12px; fill: #555; }
    .lbl   { font-size: 12px; fill: #1a1a2e; }
    .small { font-size: 11px; fill: #444; }
    .tiny  { font-size: 10px; fill: #555; }
    .mono  { font-family: Consolas, monospace; font-size: 12.5px; fill: #1a1a2e; }
    .monosm{ font-family: Consolas, monospace; font-size: 11px; fill: #444; }
    .hdr   { font-size: 13px; font-weight: 600; fill: #1a1a2e; }
  </style>
  <rect width="760" height="1030" fill="#ffffff"/>

  <text x="20" y="30" class="title">Why the weights must be re-fetched for every single pass</text>
  <text x="20" y="50" class="sub">"Resident in HBM" ≠ "already in the ALUs." HBM is the far side of the bottleneck, not a cache.</text>

  <!-- Panel A: hierarchy to scale -->
  <text x="20" y="84" class="hdr">A — The memory hierarchy on one H100, with capacities</text>

  <!-- chip boundary -->
  <rect x="40" y="100" width="420" height="215" rx="8" fill="none" stroke="#b5651d" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="52" y="120" class="tiny" fill="#b5651d">ON-CHIP (SRAM) — total ≈ 50 MB usable</text>

  <rect x="60" y="132" width="180" height="34" rx="4" fill="#b5651d" opacity="0.30"/>
  <text x="72" y="154" class="mono">registers   ~34 MB</text>
  <rect x="60" y="172" width="180" height="34" rx="4" fill="#b5651d" opacity="0.22"/>
  <text x="72" y="194" class="mono">L1/shared   ~30 MB</text>
  <rect x="60" y="212" width="180" height="34" rx="4" fill="#b5651d" opacity="0.16"/>
  <text x="72" y="234" class="mono">L2 cache     50 MB</text>

  <text x="258" y="152" class="small">This is the only place</text>
  <text x="258" y="168" class="small">an ALU can read from.</text>
  <text x="258" y="192" class="small">Everything an ALU touches</text>
  <text x="258" y="208" class="small">must be delivered here first.</text>
  <text x="258" y="238" class="small" font-weight="600">Total: ~50 MB.</text>

  <rect x="60" y="262" width="380" height="40" rx="4" fill="#fdf3e7" stroke="#d9b98a"/>
  <text x="72" y="278" class="monosm">largest single weight matrix (MLP down) = 117 MB</text>
  <text x="72" y="294" class="monosm">→ does not even fit in L2. One LAYER = 436 MB.</text>

  <!-- HBM -->
  <rect x="490" y="100" width="230" height="215" rx="8" fill="#0b6e99" opacity="0.10" stroke="#0b6e99" stroke-width="2"/>
  <text x="502" y="120" class="tiny" fill="#0b6e99">OFF-CHIP (HBM3)</text>
  <rect x="510" y="140" width="190" height="120" rx="4" fill="#0b6e99" opacity="0.30"/>
  <text x="524" y="180" class="mono">80 GB capacity</text>
  <text x="524" y="204" class="mono">weights: 16 GB</text>
  <text x="524" y="228" class="small">resident here for the</text>
  <text x="524" y="244" class="small">life of the process</text>
  <text x="502" y="285" class="small" font-weight="600">Residency is free.</text>
  <text x="502" y="301" class="small" font-weight="600">Delivery is not.</text>

  <!-- the pipe between -->
  <line x1="460" y1="207" x2="490" y2="207" stroke="#0b6e99" stroke-width="10" opacity="0.5"/>
  <text x="415" y="336" class="mono">↑ every byte the ALUs use crosses here: 3.35 TB/s</text>

  <!-- Panel B: the ratio -->
  <rect x="40" y="356" width="680" height="70" rx="6" fill="#f4f7fa" stroke="#c9d4dd"/>
  <text x="56" y="380" class="mono">15 GB streamed per pass ÷ 50 MB of on-chip SRAM = 300×</text>
  <text x="56" y="402" class="small">You can hold 0.33% of it on-chip. Keeping the weights "loaded" between passes would need</text>
  <text x="56" y="418" class="small">300× more SRAM than an H100 has. There is nowhere to keep them.</text>

  <!-- Panel C: reuse distance -->
  <text x="20" y="466" class="hdr">C — Reuse distance: by the time layer 1 is needed again, 15 GB has flowed past</text>

  <rect x="40" y="482" width="680" height="112" rx="6" fill="#ffffff" stroke="#c9d4dd"/>
  <!-- pass 1 -->
  <text x="56" y="504" class="monosm">pass N:</text>
  <g>
    <rect x="120" y="492" width="16" height="18" fill="#0b6e99" opacity="0.6"/>
    <rect x="139" y="492" width="16" height="18" fill="#0b6e99" opacity="0.55"/>
    <rect x="158" y="492" width="16" height="18" fill="#0b6e99" opacity="0.5"/>
    <text x="180" y="506" class="monosm">…</text>
    <rect x="200" y="492" width="16" height="18" fill="#0b6e99" opacity="0.45"/>
    <rect x="219" y="492" width="16" height="18" fill="#0b6e99" opacity="0.4"/>
  </g>
  <text x="248" y="506" class="monosm">L1 → L2 → L3 → … → L32   (436 MB each, 15 GB streamed)</text>
  <text x="120" y="528" class="tiny">↑ L1 weights read here…</text>

  <text x="56" y="558" class="monosm">pass N+1:</text>
  <g>
    <rect x="120" y="546" width="16" height="18" fill="#b5651d" opacity="0.6"/>
    <rect x="139" y="546" width="16" height="18" fill="#0b6e99" opacity="0.4"/>
    <rect x="158" y="546" width="16" height="18" fill="#0b6e99" opacity="0.4"/>
    <text x="180" y="560" class="monosm">…</text>
  </g>
  <text x="248" y="560" class="monosm">…L1 needed AGAIN — but 15 GB evicted it 300× over</text>
  <text x="120" y="582" class="tiny">↑ guaranteed capacity miss. Zero temporal locality at this reuse distance.</text>

  <!-- Panel D: no reuse even within a pass -->
  <text x="20" y="634" class="hdr">D — Deeper: at batch 1 there is nothing to reuse even WITHIN one pass</text>
  <rect x="40" y="650" width="680" height="118" rx="6" fill="#fdf3e7" stroke="#d9b98a"/>
  <text x="56" y="674" class="small">Part 2's FLOP ladder: each weight is multiplied EXACTLY ONCE per token. So for one token, a fetched</text>
  <text x="56" y="692" class="small">weight has exactly one consumer, then is never needed again in that pass:</text>
  <text x="56" y="716" class="mono">fetch 2 bytes → do 1 MAC (2 FLOPs) → done.  intensity = 2 FLOPs / 2 bytes = 1</text>
  <text x="56" y="742" class="small" font-weight="600">"Arithmetic intensity = 1" IS the statement "no reuse exists." Caching cannot help; there is no second use.</text>
  <text x="56" y="760" class="small">Reuse only appears when several positions need the same weight at the same time → prefill, or batching.</text>

  <!-- Panel E: what IS reused -->
  <text x="20" y="806" class="hdr">E — Your instinct is right — it's just implemented on the other object</text>
  <rect x="40" y="822" width="330" height="126" rx="6" fill="#eef5f9" stroke="#0b6e99"/>
  <text x="56" y="845" class="lbl" font-weight="600">WEIGHTS — cannot be reused</text>
  <text x="56" y="866" class="small">15 GB, needed in full every pass,</text>
  <text x="56" y="884" class="small">300× too big for on-chip memory.</text>
  <text x="56" y="906" class="small">Re-streamed 46 times for a</text>
  <text x="56" y="924" class="small">45-token answer. Unavoidable.</text>

  <rect x="390" y="822" width="330" height="126" rx="6" fill="#f0f7f0" stroke="#4a8a4a"/>
  <text x="406" y="845" class="lbl" font-weight="600">KV CACHE — is reused, exactly as you say</text>
  <text x="406" y="866" class="small">Per-position K,V computed once in</text>
  <text x="406" y="884" class="small">prefill, kept in HBM, read by every</text>
  <text x="406" y="902" class="small">later pass instead of recomputed.</text>
  <text x="406" y="924" class="small">Small, and it grows by one entry/token.</text>

  <text x="40" y="982" class="small">The distinction: weights are the same for every token (no per-token value to cache — you need all of them, every time).</text>
  <text x="40" y="1000" class="small">KV entries are per-position values already computed — caching them removes real redundant work. That's the win.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
