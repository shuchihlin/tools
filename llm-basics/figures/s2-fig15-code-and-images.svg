<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1120" viewBox="0 0 760 1120" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .title { font-size: 17px; font-weight: 600; fill: #1a1a2e; }
    .sub   { font-size: 12px; fill: #555; }
    .lbl   { font-size: 12px; fill: #1a1a2e; }
    .small { font-size: 11px; fill: #444; }
    .tiny  { font-size: 10px; fill: #555; }
    .mono  { font-family: Consolas, monospace; font-size: 12.5px; fill: #1a1a2e; }
    .monosm{ font-family: Consolas, monospace; font-size: 11px; fill: #444; }
    .hdr   { font-size: 13px; font-weight: 600; fill: #1a1a2e; }
  </style>
  <rect width="760" height="1120" fill="#ffffff"/>

  <text x="20" y="30" class="title">Same loop, or a different machine? Three cases</text>

  <!-- ===== A: coding agent ===== -->
  <text x="20" y="64" class="hdr">A — Coding agent: SAME model, SAME loop, wrapped in an outer loop</text>

  <rect x="40" y="80" width="680" height="230" rx="8" fill="#f4f7fa" stroke="#c9d4dd"/>

  <!-- inner loop box -->
  <rect x="300" y="100" width="180" height="86" rx="6" fill="#0b6e99" opacity="0.14" stroke="#0b6e99"/>
  <text x="316" y="122" class="lbl" font-weight="600">INNER LOOP</text>
  <text x="316" y="142" class="small">prefill → decode → decode…</text>
  <text x="316" y="160" class="small">one token per pass</text>
  <text x="316" y="178" class="small">(all of Session 2)</text>

  <!-- outer loop arrows -->
  <path d="M 300 143 C 220 143 200 210 260 228" fill="none" stroke="#b5651d" stroke-width="1.8"/>
  <polygon points="256,222 266,230 254,234" fill="#b5651d"/>
  <path d="M 520 228 C 570 210 560 143 480 143" fill="none" stroke="#b5651d" stroke-width="1.8"/>
  <polygon points="486,138 476,143 486,148" fill="#b5651d"/>

  <rect x="264" y="212" width="252" height="34" rx="5" fill="#fdf3e7" stroke="#d9b98a"/>
  <text x="278" y="234" class="monosm">harness runs the tool, appends result</text>

  <text x="60" y="122" class="small">model emits, as</text>
  <text x="60" y="138" class="small">ordinary TEXT:</text>
  <text x="60" y="160" class="monosm">read_file("a.py")</text>
  <text x="60" y="178" class="monosm">run_tests()</text>
  <text x="60" y="196" class="monosm">edit(old,new)</text>

  <text x="540" y="122" class="small">file contents,</text>
  <text x="540" y="138" class="small">test output, errors</text>
  <text x="540" y="160" class="small">come back as</text>
  <text x="540" y="178" class="small">INPUT TOKENS —</text>
  <text x="540" y="196" class="small">nothing else.</text>

  <text x="60" y="274" class="small" font-weight="600">Every tool result triggers a fresh PREFILL over the grown context. Context only grows within a task.</text>
  <text x="60" y="292" class="small">Weights never change. Same architecture, same vocab — code is just text to the tokenizer.</text>

  <!-- ===== B: image IN ===== -->
  <text x="20" y="348" class="hdr">B — Image as INPUT: still the same loop — the picture becomes pseudo-tokens</text>
  <rect x="40" y="364" width="680" height="96" rx="8" fill="#f0f7f0" stroke="#4a8a4a"/>
  <rect x="58" y="384" width="60" height="58" rx="4" fill="#4a8a4a" opacity="0.25"/>
  <text x="70" y="418" class="monosm">.png</text>
  <line x1="124" y1="412" x2="158" y2="412" stroke="#555"/><polygon points="158,407 168,412 158,417" fill="#555"/>
  <rect x="172" y="392" width="128" height="40" rx="4" fill="#ffffff" stroke="#4a8a4a"/>
  <text x="184" y="417" class="monosm">vision encoder</text>
  <line x1="306" y1="412" x2="340" y2="412" stroke="#555"/><polygon points="340,407 350,412 340,417" fill="#555"/>
  <g fill="#4a8a4a" opacity="0.5">
    <rect x="356" y="402" width="16" height="20"/><rect x="375" y="402" width="16" height="20"/>
    <rect x="394" y="402" width="16" height="20"/><rect x="413" y="402" width="16" height="20"/>
  </g>
  <text x="440" y="408" class="small">~hundreds of [4096] vectors,</text>
  <text x="440" y="426" class="small">spliced into the token stream</text>
  <text x="58" y="454" class="small">No embedding-table lookup — the encoder produces the vectors directly. Downstream, the 32 layers can't tell the difference.</text>

  <!-- ===== C: image OUT ===== -->
  <text x="20" y="500" class="hdr">C — Image as OUTPUT: a DIFFERENT model, a different algorithm — called as a tool</text>

  <rect x="40" y="516" width="680" height="230" rx="8" fill="#fdf3e7" stroke="#d9b98a"/>
  <text x="56" y="538" class="small">The LLM writes a prompt and calls a tool. What runs is a DIFFUSION model — not next-token prediction:</text>

  <!-- diffusion strip -->
  <g>
    <rect x="60" y="556" width="72" height="72" rx="4" fill="#888"/>
    <text x="70" y="644" class="tiny">pure noise</text>
    <text x="146" y="596" class="mono">→</text>
    <rect x="168" y="556" width="72" height="72" rx="4" fill="#9a8f7a"/>
    <text x="182" y="644" class="tiny">step 5</text>
    <text x="254" y="596" class="mono">→</text>
    <rect x="276" y="556" width="72" height="72" rx="4" fill="#a89a6a"/>
    <text x="290" y="644" class="tiny">step 15</text>
    <text x="362" y="596" class="mono">→</text>
    <rect x="384" y="556" width="72" height="72" rx="4" fill="#b5a84e"/>
    <text x="398" y="644" class="tiny">step 30</text>
    <text x="470" y="596" class="mono">→</text>
    <rect x="492" y="556" width="72" height="72" rx="4" fill="#4a8a4a" opacity="0.6"/>
    <text x="502" y="644" class="tiny">decoded image</text>
  </g>

  <text x="590" y="576" class="small">Each step refines the</text>
  <text x="590" y="592" class="small">WHOLE canvas at once.</text>
  <text x="590" y="614" class="small">Fixed ~20–50 steps,</text>
  <text x="590" y="630" class="small">regardless of content.</text>

  <rect x="60" y="660" width="640" height="70" rx="5" fill="#ffffff" stroke="#d9b98a"/>
  <text x="74" y="682" class="small">• No vocabulary, no softmax over 128,256 choices, no token-by-token append — output is continuous values.</text>
  <text x="74" y="700" class="small">• Your prompt enters as a TEXT EMBEDDING (part 3's machinery) injected via cross-attention — the one shared idea.</text>
  <text x="74" y="718" class="small">• Separate weights, separate file, separate GPU process. The LLM never "draws"; it delegates and gets a file back.</text>

  <!-- ===== D: ledger contrast ===== -->
  <text x="20" y="786" class="hdr">D — And they sit on OPPOSITE sides of the roofline</text>

  <rect x="40" y="802" width="330" height="150" rx="6" fill="#eef5f9" stroke="#0b6e99"/>
  <text x="56" y="825" class="lbl" font-weight="600">Text decode</text>
  <text x="56" y="848" class="mono">1 position per pass</text>
  <text x="56" y="870" class="mono">intensity ≈ 1</text>
  <text x="56" y="892" class="small" font-weight="600">BANDWIDTH-bound</text>
  <text x="56" y="912" class="small">ALUs ~0.3% busy; the pipe is the wall.</text>
  <text x="56" y="934" class="small">Steps = however long the answer is.</text>

  <rect x="390" y="802" width="330" height="150" rx="6" fill="#fdf3e7" stroke="#d9b98a"/>
  <text x="406" y="825" class="lbl" font-weight="600">Diffusion step</text>
  <text x="406" y="848" class="mono">~16,000 latent positions/pass</text>
  <text x="406" y="870" class="mono">intensity ≈ thousands</text>
  <text x="406" y="892" class="small" font-weight="600">COMPUTE-bound</text>
  <text x="406" y="912" class="small">ALUs saturated — like prefill, ×30.</text>
  <text x="406" y="934" class="small">Steps = fixed by the schedule.</text>

  <rect x="40" y="972" width="680" height="60" rx="6" fill="#f4f7fa" stroke="#c9d4dd"/>
  <text x="56" y="994" class="small">A text model wants memory bandwidth; an image model wants FLOPs. Same silicon, opposite bottleneck —</text>
  <text x="56" y="1014" class="small">which is why "GPU-hours" is a near-meaningless unit unless you say which workload you meant.</text>

  <text x="40" y="1062" class="small">Footnote: autoregressive image generation does exist (quantize patches into a visual vocabulary, then predict the next</text>
  <text x="40" y="1080" class="small">one exactly as with text), and newer unified multimodal models blur the split. Diffusion remains the dominant approach,</text>
  <text x="40" y="1098" class="small">and the exact architecture of any given commercial image product is generally not published.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
