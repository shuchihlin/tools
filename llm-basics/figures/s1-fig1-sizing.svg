<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 330" height="330" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><title>S1 fig1: model file size = parameters times bytes per parameter</title><desc>Bars for Llama 3 8B: FP32 32 GB, 16-bit 16 GB, INT8 8 GB, 4-bit 4 GB, against a dashed marker at 24 GB for a consumer GPU. Notes: a 70B model is 141 GB at 16-bit and 35 GB at 4-bit; running a model needs more memory than the file for the KV cache and activations.</desc>
<rect width="680" height="330" fill="#ffffff" /><text x="40" y="44" font-size="14" fill="#2C2C2A" font-weight="bold">bytes ≈ parameters × bytes per parameter</text>
<text x="40" y="66" font-size="12" fill="#5F5E5A">Llama 3 8B (8.03 billion parameters)</text>
<text x="40" y="99" dominant-baseline="central" font-size="12" fill="#5F5E5A">FP32 (4 B)</text>
<rect x="150" y="86" width="385" height="26" rx="3" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56" />
<text x="545" y="99" dominant-baseline="central" font-size="14" fill="#2C2C2A" font-weight="bold">32 GB</text>
<text x="40" y="139" dominant-baseline="central" font-size="12" fill="#5F5E5A">16-bit (2 B)</text>
<rect x="150" y="126" width="193" height="26" rx="3" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56" />
<text x="353" y="139" dominant-baseline="central" font-size="14" fill="#2C2C2A" font-weight="bold">16 GB</text>
<text x="40" y="179" dominant-baseline="central" font-size="12" fill="#5F5E5A">INT8 (1 B)</text>
<rect x="150" y="166" width="96" height="26" rx="3" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56" />
<text x="256" y="179" dominant-baseline="central" font-size="14" fill="#2C2C2A" font-weight="bold">8 GB</text>
<text x="40" y="219" dominant-baseline="central" font-size="12" fill="#5F5E5A">4-bit (0.5 B)</text>
<rect x="150" y="206" width="48" height="26" rx="3" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56" />
<text x="208" y="219" dominant-baseline="central" font-size="14" fill="#2C2C2A" font-weight="bold">4 GB</text>
<line x1="439" y1="78" x2="439" y2="242" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" />
<text x="439" y="258" text-anchor="middle" font-size="12" fill="#5F5E5A">24 GB consumer GPU</text>
<text x="40" y="290" font-size="12" fill="#5F5E5A">70B model: 141 GB at 16-bit (two 80 GB GPUs) · 35 GB at 4-bit (one)</text>
<text x="40" y="310" font-size="12" fill="#5F5E5A">Running needs more than the file: the KV cache and activations come on top</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>