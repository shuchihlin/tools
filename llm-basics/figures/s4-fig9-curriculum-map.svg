<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 420" height="420" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><title>S4 fig9: LLM Basics curriculum map, Sessions 0 to 4</title><desc>Session 4 training stages (pretraining, post-training, making it smaller) produce the weights from Session 1. At inference the weights are read by a pipeline: tokens and embeddings (Session 2), layers with attention (Session 3), the head producing word odds (Session 2), and picking one token (Session 0), which is appended and the loop repeats with the KV cache. Everything runs on GPUs where matmul, memory bandwidth, KV cache and quantization matter (Session 2).</desc>
