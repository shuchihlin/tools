<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 240" height="240" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><title>S4 fig7: a 4-bit ruler with 16 marks</title><desc>A ruler from minus 1 to plus 1 with 16 marks numbered 0 to 15. A weight of 0.31 snaps to mark 10, which is stored as binary 1010, four bits, instead of the full 16-bit value.</desc>
