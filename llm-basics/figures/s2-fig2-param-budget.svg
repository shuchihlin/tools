<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="920" height="470" fill="#fcfcfb"/>

  <!-- Title -->
  <text x="32" y="40" font-size="18" font-weight="600" fill="#0b0b0b">Llama 3 8B &#8212; where the 8,030,261,248 parameters live</text>
  <text x="32" y="62" font-size="13" fill="#52514e">vocab 128,256 &#183; d_model 4,096 &#183; 32 layers &#183; FFN width 14,336 &#183; 32 query heads sharing 8 K/V heads (GQA)</text>

  <!-- Top bar labels -->
  <text x="32" y="92" font-size="12" fill="#52514e">token embedding [128256&#215;4096] = 525&#8202;M (6.5%)</text>
  <text x="888" y="92" font-size="12" fill="#52514e" text-anchor="end">output head [4096&#215;128256] = 525&#8202;M (6.5%)</text>

  <!-- Top bar: whole model -->
  <rect x="32"  y="100" width="55" height="48" fill="#1baf7a" rx="3"/>
  <rect x="89"  y="100" width="740" height="48" fill="#2a78d6" rx="3"/>
  <rect x="831" y="100" width="57" height="48" fill="#1baf7a" rx="3"/>
  <text x="460" y="129" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">32 identical transformer layers &#8212; 6.98&#8202;B (86.9%)</text>

  <!-- Expansion connectors -->
  <line x1="89"  y1="148" x2="32"  y2="230" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="829" y1="148" x2="888" y2="230" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="460" y="222" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">one layer = 218.1&#8202;M parameters (&#215;32)</text>

  <!-- One-layer bar: Q K V O gate up down -->
  <g>
    <rect x="32"  y="230" width="65"  height="48" fill="#2a78d6" rx="3"/>
    <rect x="99"  y="230" width="16"  height="48" fill="#2a78d6" rx="3"/>
    <rect x="117" y="230" width="16"  height="48" fill="#2a78d6" rx="3"/>
    <rect x="135" y="230" width="65"  height="48" fill="#2a78d6" rx="3"/>
    <rect x="202" y="230" width="227" height="48" fill="#eb6834" rx="3"/>
    <rect x="431" y="230" width="227" height="48" fill="#eb6834" rx="3"/>
    <rect x="660" y="230" width="228" height="48" fill="#eb6834" rx="3"/>
  </g>

  <!-- Segment labels -->
  <g font-size="12" fill="#0b0b0b" text-anchor="middle">
    <text x="64"  y="298">Q</text>
    <text x="107" y="298">K</text>
    <text x="125" y="298">V</text>
    <text x="167" y="298">O</text>
    <text x="315" y="298">gate</text>
    <text x="544" y="298">up</text>
    <text x="774" y="298">down</text>
  </g>

  <!-- Group annotations -->
  <g font-size="12.5" fill="#52514e">
    <text x="32" y="330">attention: Q, O each [4096&#215;4096] = 16.8&#8202;M</text><text x="32" y="348">K, V each [4096&#215;1024] = 4.2&#8202;M (narrow: shared by 4 heads)</text>
    <text x="888" y="330" text-anchor="end">MLP &#8212; each [4096&#215;14336] = 58.7&#8202;M</text>
  </g>
  <g font-size="12.5" fill="#898781">
    <text x="32" y="366">total 41.9&#8202;M (19%)</text>
    <text x="888" y="348" text-anchor="end">3 &#215; 58.7&#8202;M = 176.2&#8202;M (81%)</text>
  </g>
  <text x="32" y="388" font-size="12" fill="#898781">(+ two norm vectors of 4,096 each &#8212; rounding error)</text>

  <!-- Divider -->
  <line x1="32" y1="404" x2="888" y2="404" stroke="#e1e0d9" stroke-width="1"/>

  <!-- Footer math -->
  <text x="32" y="428" font-size="14" fill="#0b0b0b">File size: 8.03&#8202;B params &#215; 2 bytes (BF16) &#8776; <tspan font-weight="600">16.1 GB</tspan> &#8212; Session 1&#8217;s sizing rule, now itemized.</text>
  <text x="32" y="450" font-size="12.5" fill="#52514e">Note the shape: 87% of the model is just 7 matrices, stamped out 32 times; the rest is the 128K-entry vocabulary at each end.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
