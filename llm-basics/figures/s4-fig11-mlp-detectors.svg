<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 370" height="370" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><title>S4 fig11: the MLP as a bank of pattern detectors</title><desc>A word vector of 4096 numbers is checked by 14,336 detectors, five shown. The Eiffel Tower and a location detectors fire; sports, code and past tense stay dark. Only firing detectors write back, adding Paris and France into the vector.</desc>
