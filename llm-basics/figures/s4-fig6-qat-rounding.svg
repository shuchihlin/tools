<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 300" height="300" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><title>S4 fig6: toy example, rounding after training (PTQ) vs. QAT</title><desc>Four precise weights 0.27, 0.30, 0.33 and 0.36 on a grid with steps of 0.25 and a rounding boundary at 0.375. Rounded after training, all four drop to 0.25, sum 1.00 versus the wanted 1.26. With QAT the master weights are nudged up by 0.03 to 0.30, 0.33, 0.36 and 0.39; the last crosses the boundary and rounds to 0.5, so the sum becomes 1.25.</desc>
<rect width="680" height="300" fill="#ffffff" /><text x="410" y="62" text-anchor="middle" font-size="12" fill="#5F5E5A">rounding boundary 0.375</text>
<line x1="410" y1="72" x2="410" y2="250" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3" />
<text x="40" y="124" dominant-baseline="central" font-size="14" fill="#2C2C2A" font-weight="bold">PTQ</text>
<line x1="80" y1="120" x2="520" y2="120" stroke="#888780" stroke-width="1" />
<line x1="80" y1="113" x2="80" y2="127" stroke="#888780" stroke-width="1" />
<line x1="300" y1="113" x2="300" y2="127" stroke="#888780" stroke-width="1" />
<line x1="520" y1="113" x2="520" y2="127" stroke="#888780" stroke-width="1" />
<text x="80" y="145" text-anchor="middle" font-size="12" fill="#5F5E5A">0</text>
<text x="300" y="145" text-anchor="middle" font-size="12" fill="#5F5E5A">0.25</text>
<text x="520" y="145" text-anchor="middle" font-size="12" fill="#5F5E5A">0.5</text>
<circle cx="318" cy="120" r="5" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D" />
<circle cx="344" cy="120" r="5" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D" />
<circle cx="370" cy="120" r="5" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D" />
<circle cx="397" cy="120" r="5" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D" />
<text x="300" y="168" text-anchor="middle" font-size="12" fill="#5F5E5A">all four round down to 0.25</text>
<text x="545" y="113" font-size="14" fill="#2C2C2A" font-weight="bold">sum 1.00</text>
<text x="545" y="132" font-size="12" fill="#5F5E5A">want 1.26</text>
<text x="40" y="224" dominant-baseline="central" font-size="14" fill="#2C2C2A" font-weight="bold">QAT</text>
<line x1="80" y1="220" x2="520" y2="220" stroke="#888780" stroke-width="1" />
<line x1="80" y1="213" x2="80" y2="227" stroke="#888780" stroke-width="1" />
<line x1="300" y1="213" x2="300" y2="227" stroke="#888780" stroke-width="1" />
<line x1="520" y1="213" x2="520" y2="227" stroke="#888780" stroke-width="1" />
<text x="80" y="245" text-anchor="middle" font-size="12" fill="#5F5E5A">0</text>
<text x="300" y="245" text-anchor="middle" font-size="12" fill="#5F5E5A">0.25</text>
<text x="520" y="245" text-anchor="middle" font-size="12" fill="#5F5E5A">0.5</text>
<circle cx="344" cy="220" r="5" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D" />
<circle cx="370" cy="220" r="5" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D" />
<circle cx="397" cy="220" r="5" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D" />
<circle cx="423" cy="220" r="6" stroke-width="1" fill="#E1F5EE" stroke="#0F6E56" />
<text x="423" y="200" text-anchor="middle" font-size="12" fill="#5F5E5A">flips to 0.5</text>
<text x="300" y="268" text-anchor="middle" font-size="12" fill="#5F5E5A">three round to 0.25, one to 0.5</text>
<text x="545" y="213" font-size="14" fill="#2C2C2A" font-weight="bold">sum 1.25</text>
<text x="545" y="232" font-size="12" fill="#5F5E5A">want 1.26</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>