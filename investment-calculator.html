<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投資報酬率計算器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&family=DM+Mono:wght@300;400;500&display=swap');

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #21262d;
    --accent: #58a6ff;
    --green: #3fb950;
    --gold: #e3b341;
    --text: #e6edf3;
    --muted: #8b949e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }

  h1 {
    font-family: 'DM!Mono', monospace;
    font-size: 1.1rem;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 0.3rem;
  }

  .subtitle {
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    margin-bottom: 2rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    width: 100%;
    max-width: 640px;
    margin-bottom: 1.5rem;
  }

  .slider-group {
    margin-bottom: 1.4rem;
  }

  .slider-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.5rem;
  }

  .slider-label span:first-child {
    font-size: 0.85rem;
    color: var(--muted);
  }

  .slider-value {
    font-family: 'DM Mono', monospace;
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--text);
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 4px;
    outline: none;
    cursor: pointer;
  }

  #slider-monthly { background: linear-gradient(to right, var(--accent) var(--pct-m, 30%), var(--border) var(--pct-m, 30%)); }
  #slider-rate    { background: linear-gradient(to right, var(--green) var(--pct-r, 50%), var(--border) var(--pct-r, 50%)); }
  #slider-years   { background: linear-gradient(to right, var(--gold) var(--pct-y, 50%), var(--border) var(--pct-y, 50%)); }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.15);
    transition: box-shadow 0.15s;
  }
  input[type=range]:hover::-webkit-slider-thumb {
    box-shadow: 0 0 0 5px rgba(255,255,255,0.2);
  }

  /* Results */
  .results-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1rem;
  }

  .result-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
    text-align: center;
  }

  .result-box .label {
    font-size: 0.72rem;
    color: var(--muted);
    margin-bottom: 0.4rem;
    letter-spacing: 0.04em;
  }

  .result-box .amount {
    font-family: 'DM Mono', monospace;
    font-size: 1.05rem;
    font-weight: 500;
  }

  .result-box.principal .amount { color: var(--accent); }
  .result-box.profit   .amount { color: var(--green); }
  .result-box.total    .amount { color: var(--gold); }

  /* Bar chart */
  .chart-area {
    margin-top: 1.5rem;
  }

  .chart-title {
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 0.8rem;
    letter-spacing: 0.05em;
  }

  .bar-container {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 140px;
    padding-bottom: 0;
    overflow: hidden;
  }

  .bar-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
    position: relative;
  }

  .bar-stack {
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    transition: height 0.3s ease;
  }

  .bar-principal {
    background: var(--accent);
    opacity: 0.85;
    border-radius: 2px 2px 0 0;
    transition: height 0.3s ease;
  }

  .bar-profit {
    background: var(--green);
    opacity: 0.85;
    border-radius: 2px 2px 0 0;
    transition: height 0.3s ease;
  }

  .bar-year-label {
    font-family: 'DM!Mono', monospace;
    font-size: 0.55rem;
    color: var(--muted);
    margin-top: 3px;
    white-space: nowrap;
  }

  .legend {
    display: flex;
    gap: 1.2rem;
    margin-top: 0.8rem;
    font-size: 0.72rem;
    color: var(--muted);
  }

  .legend-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 2px;
    margin-right: 4px;
    vertical-align: middle;
  }

  .ratio-bar {
    margin-top: 1.2rem;
    height: 10px;
    border-radius: 5px;
    overflow: hidden;
    display: flex;
  }
  .ratio-principal { background: var(--accent); opacity: 0.85; transition: width 0.3s; }
  .ratio-profit    { background: var(--green);  opacity: 0.85; transition: width 0.3s; }
  .ratio-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 0.3rem;
  }

  .footer {
    font-size: 0.68rem;
    color: var(--border);
    margin-top: 1rem;
    text-align: center;
  }
</style>
</head>
<body>

<h1>投資報酬率計算器</h1>
<p class="subtitle">Investment Return Calculator · 複利詧算</p>

<div class="card">
  <!-- Sliders -->
  <div class="slider-group">
    <div class="slider-label">
      <span>每月投資金額</span>
      <span class="slider-value" id="val-monthly">$3,000</span>
    </div>
    <input type="range" id="slider-monthly" min="500" max="20000" step="500" value="3000">
  </div>

  <div class="slider-group">
    <div class="slider-label">
      <span>年報酬率</span>
      <span class="slider-value" id="val-rate">7.0%</span>
    </div>
    <input type="range" id="slider-rate" min="1" max="20" step="0.5" value="7">
  </div>

  <div class="slider-group" style="margin-bottom:0">
    <div class="slider-label">
      <span>投資年數</span>
      <span class="slider-value" id="val-years">20 年</span>
    </div>
    <input type="range" id="slider-years" min="1" max="40" step="1" value="20">
  </div>
</div>

<!-- Results -->
<div class="card">
  <div class="results-grid">
    <div class="result-box principal">
      <div class="label">本金合計</div>
      <div class="amount" id="res-principal">—</div>
    </div>
    <div class="result-box profit">
      <div class="label">利潤合計</div>
      <div class="amount" id="res-profit">—</div>
    </div>
    <div class="result-box total">
      <div class="label">總資產</div>
      <div class="amount" id="res-total">—</div>
    </div>
  </div>

  <div class="ratio-bar" id="ratio-bar">
    <div class="ratio-principal" id="ratio-p" style="width:50%"></div>
    <div class="ratio-profit"    id="ratio-i" style="width:50%"></div>
  </div>
  <div class="ratio-labels">
    <span id="ratio-p-label">本金 50%</span>
    <span id="ratio-i-label">利潤 50%</span>
  </div>

  <!-- Bar chart -->
  <div class="chart-area">
    <div class="chart-title">逐年累積 — 本金 vs 利潤</div>
    <div class="bar-container" id="bar-chart"></div>
    <div class="legend">
      <span><span class="legend-dot" style="background:var(--accent)"></span>本金</span>
      <span><span class="legend-dot" style="background:var(--green)"></span>利潤</span>
    </div>
  </div>
</div>

<div class="footer">複利計算 · 僅供參考，非投資建議</div>

<script>
  const sliderM = document.getElementById('slider-monthly');
  const sliderR = document.getElementById('slider-rate');
  const sliderY = document.getElementById('slider-years');

  function fmt(n) {
    if (n >= 1e6) return '$' + (n/1e6).toFixed(2) + 'M';
    if (n >= 1e3) return '$' + (n/1e3).toFixed(1) + 'K';
    return '$' + n.toFixed(0);
  }

  function calcFV(monthly, annualRate, years) {
    const r = annualRate / 100 / 12;
    const n = years * 12;
    if (r === 0) return monthly * n;
    return monthly * ((Math.pow(1 + r, n) - 1) / r) * (1 + r);
  }

  function update() {
    const monthly = parseFloat(sliderM.value);
    const rate    = parseFloat(sliderR.value);
    const years   = parseInt(sliderY.value);

    document.getElementById('val-monthly').textContent = '$' + monthly.toLocaleString();
    document.getElementById('val-rate').textContent    = rate.toFixed(1) + '%';
    document.getElementById('val-years').textContent   = years + ' 年';

    // Update slider fill
    const pctM = (monthly - 500)  / (20000 - 500)  * 100;
    const pctR = (rate - 1)       / (20 - 1)        * 100;
    const pctY = (years - 1)      / (40 - 1)        * 100;
    sliderM.style.setProperty('--pct-m', pctM + '%');
    sliderR.style.setProperty('--pct-r', pctR + '%');
    sliderY.style.setProperty('--pct-y', pctY + '%');

    const principal = monthly * 12 * years;
    const total     = calcFV(monthly, rate, years);
    const profit    = total - principal;

    document.getElementById('res-principal').textContent = fmt(principal);
    document.getElementById('res-profit').textContent    = fmt(profit);
    document.getElementById('res-total').textContent     = fmt(total);

    const pctP = (principal / total * 100).toFixed(1);
    const pctI = (profit    / total * 100).toFixed(1);
    document.getElementById('ratio-p').style.width = pctP + '%';
    document.getElementById('ratio-i').style.width = pctI + '%';
    document.getElementById('ratio-p-label').textContent = '本金 ' + pctP + '%';
    document.getElementById('ratio-i-label').textContent = '利潤 ' + pctI + '%';

    // Bar chart
    buildChart(monthly, rate, years);
  }

  function buildChart(monthly, rate, years) {
    const container = document.getElementById('bar-chart');
    container.innerHTML = '';

    // Determine step: show at most ~20 bars
    const step = Math.max(1, Math.ceil(years / 20));
    const dataPoints = [];
    let maxVal = 0;

    for (let y = step; y <= years; y += step) {
      const p = monthly * 12 * y;
      const t = calcFV(monthly, rate, y);
      const i = t - p;
      dataPoints.push({ year: y, principal: p, profit: i, total: t });
      if (t > maxVal) maxVal = t;
    }
    // Ensure last year is included
    const lastY = years;
    if (dataPoints.length === 0 || dataPoints[dataPoints.length-1].year !== lastY) {
      const p = monthly * 12 * lastY;
      const t = calcFV(monthly, rate, lastY);
      dataPoints.push({ year: lastY, principal: p, profit: t - p, total: t });
      if (t > maxVal) maxVal = t;
    }

    const H = 130; // chart height px

    dataPoints.forEach(d => {
      const wrap = document.createElement('div');
      wrap.className = 'bar-wrap';

      const totalH  = Math.round((d.total     / maxVal) * H);
      const profitH = Math.round((d.profit    / maxVal) * H);
      const princH  = totalH - profitH;

      const stack = document.createElement('div');
      stack.className = 'bar-stack';
      stack.style.height = totalH + 'px';

      const bP = document.createElement('div');
      bP.className = 'bar-profit';
      bP.style.height = profitH + 'px';

      const bPr = document.createElement('div');
      bPr.className = 'bar-principal';
      bPr.style.height = princH + 'px';

      stack.appendChild(bP);
      stack.appendChild(bPr);

      const lbl = document.createElement('div');
      lbl.className = 'bar-year-label';
      lbl.textContent = 'Y' + d.year;

      wrap.appendChild(stack);
      wrap.appendChild(lbl);
      container.appendChild(wrap);
    });
  }

  [sliderM, sliderR, sliderY].forEach(s => s.addEventListener('input', update));
  update();
</script>
</body>
</html>
